<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>بيت فايز HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D cross-section of the house tower; header + agent pipeline float on top, chat with the general manager docked at the bottom, agent/printer cards slide over the scene. Single warm-night look by design (day mode only changes the 3D lighting). */
:root{
  --bg:#07080d; --glass:#12141cd9; --glass2:#1a1d28f0; --line:#2a2f3f; --ink:#f3ede0; --mute:#9a9484;
  --gold:#ffc657; --gold2:#ff9f2e; --ok:#3fe08c; --busy:#46b4ff; --done:#ffc657; --sleep:#a98bff; --bad:#ff4f6a;
  --ui:"Readex Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui)}
body{overflow:hidden}
#app{position:relative;height:100%;direction:rtl;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:absolute;z-index:5;pointer-events:none}
.ui>*{pointer-events:auto}
/* header */
.top{top:0;left:0;right:0;padding-block:10px 0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px;background:linear-gradient(#07080df2,#07080d00)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-inline-end:auto}
.brand b{font-size:1.1rem;letter-spacing:.3px}
.brand b span{color:var(--gold)}
.brand small{font:500 .62rem var(--mono);color:var(--mute);letter-spacing:1.6px;direction:ltr;text-align:right}
.pill{font:500 .72rem var(--ui);display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(8px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill em{font:700 .72rem var(--mono);font-style:normal;color:var(--c)}
button{font-family:var(--ui);cursor:pointer}
.btn{font:600 .74rem var(--ui);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);backdrop-filter:blur(8px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1800;border:0}
.btn:focus-visible,.chipq:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* pipeline */
.pipe{direction:ltr;display:flex;align-items:center;gap:0;padding:8px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);max-width:560px;width:100%;justify-self:center;transition:opacity .3s}
.pipe.idle{opacity:.55}
.node{display:grid;justify-items:center;gap:4px;flex:none;width:58px}
.node .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1b2030;border:1px solid var(--line);color:var(--mute);transition:.3s}
.node .ic svg{width:15px;height:15px}
.node span{font:700 .5rem var(--mono);letter-spacing:.8px;color:var(--mute);white-space:nowrap}
.node.on .ic{background:#2b7cff;border-color:#6aa6ff;color:#fff;box-shadow:0 0 14px #2b7cffaa}
.node.on span{color:#cfe0ff}
.node.cur .ic{animation:pulse 1s infinite}
.link{flex:1;height:2px;background:var(--line);position:relative;min-width:8px}
.link i{position:absolute;inset:0;width:0;background:#2b7cff;box-shadow:0 0 8px #2b7cff;transition:width .5s}
.link.on i{width:100%}
@keyframes pulse{50%{box-shadow:0 0 0 6px #2b7cff33,0 0 18px #2b7cffcc}}
/* labels */
.tag{position:absolute;left:0;top:0;z-index:3;display:grid;justify-items:center;gap:4px;white-space:nowrap;cursor:pointer;will-change:transform}
.tag .nm{font:600 .62rem var(--ui);display:flex;align-items:center;gap:5px;padding:3px 8px 3px 7px;border-radius:999px;background:#0b0d14d9;border:1px solid #3a3426;color:var(--ink)}
.tag .nm i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.tag .nm svg{width:9px;height:9px;opacity:.6}
.tag.sel .nm{border-color:var(--gold);box-shadow:0 0 12px #ffc65766}
.tag .say{font:600 .68rem/1.45 var(--ui);background:#fff8ea;color:#231a08;padding:5px 9px;border-radius:10px;max-width:190px;white-space:normal;text-align:center;box-shadow:0 6px 20px #0008;position:relative}
.tag .say::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff8ea}
.tag:focus-visible .nm{outline:2px solid var(--gold)}
.rbusy{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font:700 .62rem var(--ui);padding:3px 9px;border-radius:999px;color:#fff;background:var(--c);box-shadow:0 0 14px var(--c);white-space:nowrap;animation:rb 1.2s ease-in-out infinite;will-change:transform}
@keyframes rb{50%{box-shadow:0 0 4px var(--c);opacity:.8}}
@media (prefers-reduced-motion:reduce){.rbusy{animation:none}}
/* cards */
.card{position:absolute;z-index:6;top:132px;left:max(14px,env(safe-area-inset-left,0px));width:min(300px,calc(100% - 28px));background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 20px 50px #000a;display:grid;gap:10px}
.card h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:8px}
.card h3 i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card .x{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#0006;color:var(--ink)}
.card .sub{font:500 .62rem var(--mono);color:var(--mute);letter-spacing:1px;direction:ltr;text-align:right}
.spec{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spec div{background:#0c0e15;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.spec b{display:block;font:700 .82rem var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.spec span{font:500 .55rem var(--mono);color:var(--mute);letter-spacing:.6px}
.trays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;direction:ltr}
.tray{display:flex;align-items:center;gap:5px;font:500 .62rem var(--mono);color:var(--mute);background:#0c0e15;border:1px solid var(--line);border-radius:8px;padding:5px 6px;white-space:nowrap;overflow:hidden}
.tray i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #fff4}
.tray.on{border-color:var(--busy);color:var(--ink)}
.bar{height:6px;border-radius:3px;background:#0c0e15;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s}
.hist{display:grid;gap:4px;font-size:.72rem;color:var(--mute);max-height:120px;overflow:auto}
.hist div{padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
/* dock */
.dock{bottom:0;left:0;right:0;padding-block:24px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px;background:linear-gradient(#07080d00,#07080df5 38%)}
.feed{display:grid;gap:5px;max-height:16vh;overflow-y:auto;font-size:.76rem;line-height:1.5;max-width:620px;width:100%;justify-self:center;mask-image:linear-gradient(transparent,#000 30%)}
.msg{padding:5px 10px;border-radius:12px;background:#151824e6;border:1px solid var(--line);justify-self:start;max-width:92%}
.msg b{color:var(--gold);font-weight:600}
.rem{display:grid;gap:6px;max-height:150px;overflow:auto}
.rem .it{display:flex;gap:8px;align-items:center;font-size:.74rem;background:#0c0e15;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.rem .it b{font-weight:600;color:var(--ink)}.rem .it span{color:var(--mute);font:500 .64rem var(--mono);direction:ltr}
.rem .it .del{margin-inline-start:auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);flex:none}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rf input,.rf select{min-width:0;font:400 .76rem var(--ui);background:#0c0e15;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.rf .full{grid-column:1/-1}
.rf label{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--mute)}
.msg a.mlink{color:var(--gold);font-weight:600;text-decoration:underline;display:inline-block;margin-top:4px}
.msg.me{background:#2b7cff;border-color:#2b7cff;color:#fff;justify-self:end}
.msg.sys{background:none;border:0;color:var(--mute);font:500 .66rem var(--mono);direction:ltr;justify-self:center}
.quick{display:flex;gap:6px;overflow-x:auto;max-width:620px;width:100%;justify-self:center;scrollbar-width:none}
.chipq{flex:none;font:500 .72rem var(--ui);padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
form{display:flex;gap:8px;max-width:620px;width:100%;justify-self:center}
.inp{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#10121a;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.inp input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:400 .86rem var(--ui);padding:7px 0}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--gold)}
.mic{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1800;display:grid;place-items:center;flex:none}
.mic svg{width:16px;height:16px}
.micbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#1b1f2b;color:var(--ink);display:grid;place-items:center;flex:none}
.micbtn svg{width:17px;height:17px}
.micbtn[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{box-shadow:0 0 0 7px #ff4f6a33}}
.lang{min-width:30px;height:30px;border-radius:15px;border:1px solid var(--line);background:none;color:var(--mute);font:700 .68rem var(--mono);flex:none;padding:0 6px}
.micbtn:focus-visible,.lang:focus-visible,.mic:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.floors{top:50%;right:max(10px,env(safe-area-inset-right,0px));transform:translateY(-50%);display:grid;gap:5px;z-index:6}
.floors button{font:600 .66rem var(--ui);min-width:62px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--mute);backdrop-filter:blur(8px);text-align:center}
.floors button[aria-pressed="true"]{color:#2a1800;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
.floors button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.floors button.on{color:var(--ink);border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.floors button .bd{display:none;margin-inline-start:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--c);color:#fff;font:700 .58rem/16px var(--mono);vertical-align:middle;animation:bd 1.2s ease-in-out infinite}
.floors button.on .bd{display:inline-block}
@keyframes bd{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.floors button .bd{animation:none}}
.floors .zm{display:flex;gap:5px}.floors .zm button{min-width:0;flex:1;font:700 .9rem var(--mono);padding:4px 0}
#liveBadge{cursor:default}
@media (max-width:520px){.floors button{min-width:52px;font-size:.6rem;padding:5px 6px}}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.8rem;z-index:1}
@media (max-width:640px){
  .top{gap:6px;padding-block:8px 0}
  .brand b{font-size:.98rem}.brand small{font-size:.54rem;letter-spacing:1px}
  .btn{padding:5px 10px;font-size:.68rem}
  #counts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px}
  #counts .pill{flex:none;padding:3px 8px;font-size:.62rem}
  .pipe{padding:5px 8px;border-radius:12px}
  .node{width:40px;gap:2px}.node .ic{width:24px;height:24px}.node .ic svg{width:12px;height:12px}.node span{font-size:.4rem;letter-spacing:.3px}
  .floors{position:static;transform:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:620px;width:100%;justify-self:center}
  .floors button{flex:none;min-width:0;padding:6px 10px}
  .floors .zm{flex:none}.floors .zm button{width:34px}
  .card{top:auto;bottom:calc(var(--dockH,180px) + 6px);left:8px;right:8px;width:auto;max-height:46vh;overflow-y:auto;padding:12px}
  .feed{max-height:11vh;font-size:.72rem}
  .dock{padding-block:14px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
  .chipq{font-size:.66rem;padding:5px 9px}
  .tag .nm{font-size:.54rem;padding:2px 6px}
  .tag .say{font-size:.62rem;max-width:150px}
  .inp{padding:3px 4px 3px 10px;gap:5px}.inp input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.node.cur .ic{animation:none}}
</style>

<div id="app">
  <div id="stage"><div id="loading">يجهّز البيت…</div></div>

  <div class="ui top">
    <div class="row">
      <div class="brand"><b>بيت <span>فايز</span> HQ</b><small>FAYEZ HOME · 9 AGENTS · v22</small></div>
      <span class="pill" id="liveBadge" style="--c:var(--mute)" title="وضع التشغيل"><i></i>تجريبي</span>
      <button class="btn" id="dayBtn" aria-pressed="false">☾ ليلي</button>
      <button class="btn gold" id="updBtn">أبديت</button>
    </div>
    <div class="row" id="counts"></div>
    <div class="pipe idle" id="pipe"></div>
  </div>

  <div class="card" id="card" hidden></div>
  <nav class="ui floors" id="floors" aria-label="الطوابق"></nav>

  <div class="ui dock">
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form id="form">
      <div class="inp"><input id="q" placeholder="اكتب للمدير العام… أو @ لأي وكيل" autocomplete="off" aria-label="رسالة للمدير العام">
        <button type="button" class="lang" id="langBtn" aria-label="لغة الميكروفون">ع</button>
        <button type="button" class="micbtn" id="micBtn" aria-label="تكلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="mic" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </form>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as CORE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
CORE.ColorManagement.enabled=false;   // keep the original (r128-style) colours
const THREE=Object.assign({},CORE,{OrbitControls,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,RoundedBoxGeometry,RoomEnvironment});
'use strict';
/* =====================================================================
   بيت فايز HQ
   Event API (for the real bridge later):
     tower.emit({type:'print', part:21})      Bambu A2L print request
     tower.emit({type:'stuck'})                A2L camera detected a failure
     tower.emit({type:'bill', name:'الكهرباء', amount:420})
     tower.emit({type:'maintenance', item:'المكيف'})
     tower.emit({type:'trip', place:'العلا'})
     tower.emit({type:'design', item:'حامل جوال'})
     tower.emit({type:'report'})
   ===================================================================== */
const $=id=>document.getElementById(id);
const stage=$('stage');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,reduced?Math.min(ms,400):ms));
const TAU=Math.PI*2;
let cardFor=null;

/* ---------------- renderer / scene ---------------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;renderer.useLegacyLights=true;
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement); $('loading').remove();
const scene=new THREE.Scene();
const NIGHT_BG=new THREE.Color('#07080d'), DAY_BG=new THREE.Color('#1c2433');
scene.background=NIGHT_BG.clone();
scene.fog=new THREE.Fog('#07080d',60,120);
const camera=new THREE.PerspectiveCamera(30,1,0.1,300);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.enablePan=true; controls.screenSpacePanning=true; controls.panSpeed=1;
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};
controls.minPolarAngle=Math.PI*.22; controls.maxPolarAngle=Math.PI*.54;
controls.minAzimuthAngle=-Math.PI*.42; controls.maxAzimuthAngle=Math.PI*.42;
controls.rotateSpeed=.6; controls.zoomSpeed=.8;
const hemi=new THREE.HemisphereLight('#bcc6ff','#1a1208',.32); scene.add(hemi);
const moon=new THREE.DirectionalLight('#9fb2ff',.25); moon.position.set(-10,30,20); scene.add(moon);
const fill=new THREE.DirectionalLight('#ffd9a8',.18); fill.position.set(12,8,30); scene.add(fill);

let composer=null, bloom=null;
try{
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.38,.4,.92);
  composer.addPass(bloom);
  composer.addPass(new THREE.OutputPass());
}catch(e){composer=null;}

/* ---------------- helpers ---------------- */
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.05},o));
const glowMat=c=>new THREE.MeshBasicMaterial({color:c});
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m;}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,parent=scene,seg=20){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);parent.add(m);return m;}
function sph(r,mat,x=0,y=0,z=0,parent=scene,seg=20){const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.round(seg*.75)),mat);m.position.set(x,y,z);parent.add(m);return m;}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.userData={c,g,draw};return t;}
function redraw(t){const {c,g,draw}=t.userData;g.clearRect(0,0,c.width,c.height);draw(g,c.width,c.height);t.needsUpdate=true;}
const glowTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
function glow(color,size,x,y,z,parent=scene,op=.8){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);s.position.set(x,y,z);parent.add(s);return s;}

/* ---------------- building ---------------- */
const FH=3.4, X0=-8, X1=8, ZB=-3.5, ZF=3.5, CORR=2.45, EX=9.75, EDOOR=8.55, NF=5;
const fy=f=>f*FH;
const woodTex=canvasTex(512,512,(g,w,h)=>{
  const rows=6, ph=h/rows; g.fillStyle='hsl(28,40%,24%)';g.fillRect(0,0,w,h);

const MS={
  data:{program:'MBA Standard – Intake 26',school:'IBA London',start:new Date().toISOString().slice(0,10),pacePerWeek:2,lectureHours:2,baseline:1,
    modules:MBA_MODULES.map(([en,ar,n],i)=>({en,ar,lectures:n,done:i===0?1:0,exam:false,assignment:false}))},
  cur(){const m=this.data.modules;let i=m.findIndex(x=>x.done<x.lectures||!x.exam);return i<0?m.length:i;},
  state(){const m=this.data.modules,ci=this.cur(),total=m.reduce((a,x)=>a+x.lectures,0),done=m.reduce((a,x)=>a+x.done,0);
    const weeks=Math.max(0,(Date.now()-new Date(this.data.start).getTime())/6048e5),expected=Math.floor(weeks*this.data.pacePerWeek);
    const mod=m[Math.min(ci,m.length-1)];
    return {ci,mod,finished:ci>=m.length,modsDone:m.filter(x=>x.done>=x.lectures&&x.exam).length,nMods:m.length,total,done,remaining:total-done,hoursLeft:(total-done)*this.data.lectureHours,
      behind:Math.max(0,expected-(done-(this.data.baseline||0))),examDue:mod.done>=mod.lectures&&!mod.exam,nextLec:mod.done+1};},
  summary(){const s=this.state();if(s.finished)return 'خلصت المحاور الثمانية كلها 🎓 مبروك يا أبو خالد!';
    const m=s.mod;const head=`المحور ${s.ci+1} من ${s.nMods}: ${m.ar}.`;
    const now=s.examDue?` خلصت محاضراته السبع ✓ الجاي: الاختبار النهائي (60 سؤال اختيار من متعدد، ساعتين).`:` خلصت ${m.done} من ${m.lectures} محاضرات. الجاية: Lech ${s.nextLec}.`;
    return `${head}${now} الإجمالي: ${s.done} من ${s.total} محاضرة، باقي ${s.remaining} (~${s.hoursLeft} ساعة).${s.behind>0?` متأخر ${s.behind} عن الخطة.`:''}`;},
  lectureDone(){const s=this.state();if(s.finished)return null;const m=s.mod;if(m.done<m.lectures){m.done++;return {kind:'lecture',m,n:m.done};}return {kind:'examDue',m};},
  examDone(){const s=this.state();if(s.finished)return null;const m=s.mod;m.exam=true;return {kind:'exam',m};},
  assignmentDone(){const m=this.data.modules.find(x=>!x.assignment);if(!m)return null;m.assignment=true;return {kind:'assignment',m};},
};

const tweens=[];
function tween(sec,fn){if(reduced)sec=Math.min(sec,.05);return new Promise(r=>tweens.push({t:0,sec:Math.max(.001,sec),fn,r}));}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
async function face(a,ang){const s=a.g.rotation.y;let d=((ang-s+Math.PI)%TAU+TAU)%TAU-Math.PI;await tween(Math.abs(d)/7,k=>a.g.rotation.y=s+d*ease(k));}
async function walkTo(a,x,z){
  const p=a.g.position,sx=p.x,sz=p.z,d=Math.hypot(x-sx,z-sz);if(d<.02)return;
  a.mode='walk';a.atHome=false;await face(a,Math.atan2(x-sx,z-sz));
  await tween(d/2.1,k=>{p.x=sx+(x-sx)*k;p.z=sz+(z-sz)*k;});
}
let carFloor=0, lock=Promise.resolve();

function animateAgent(a,dt,t){
  const u=a.g.userData;a.phase+=dt;const ph=a.phase;
  let by=0,legX=0,armX=0,armXR=null,headX=0,headY=0;
  switch(a.mode){
    case 'walk':{const s=Math.sin(ph*9.5);legX=s*.65;armX=-s*.55;by=Math.abs(Math.cos(ph*9.5))*.06;break;}
    case 'sit':by=-u.sitDrop;legX=-1.45;armX=-.35;headY=Math.sin(ph*.6)*.25;headX=Math.sin(ph*.9)*.04;break;
    case 'type':by=-u.sitDrop;legX=-1.45;armX=-1.05;armXR=-1.05+Math.sin(ph*22)*.12;headX=.12+Math.sin(ph*3)*.03;headY=Math.sin(ph*.8)*.12;break;
    case 'sleep':by=-u.sitDrop;legX=-1.45;armX=-1.2;headX=.55;break;
    case 'talk':armX=-.2;armXR=-.9+Math.sin(ph*5)*.35;headX=Math.sin(ph*6)*.08;by=Math.sin(ph*3)*.01;break;
    case 'ride':case 'stand':default:by=Math.sin(ph*2)*.012;armX=Math.sin(ph*2)*.04;
  }
  const L=.18; // smoothing
  u.body.position.y+=(by-u.body.position.y)*L*3;
  u.legs[0].rotation.x+=(legX-u.legs[0].rotation.x)*L*2.5;u.legs[1].rotation.x+=((a.mode==='walk'?-legX:legX)-u.legs[1].rotation.x)*L*2.5;
  u.arms[0].rotation.x+=((armXR!==null?armX+Math.sin(ph*22+1.5)*(a.mode==='type'?.12:0):armX)-u.arms[0].rotation.x)*L*2.5;
  u.arms[1].rotation.x+=((armXR!==null?armXR:(a.mode==='walk'?-armX:armX))-u.arms[1].rotation.x)*L*2.5;
  u.head.rotation.x+=(headX-u.head.rotation.x)*L;u.head.rotation.y+=(headY-u.head.rotation.y)*L;
  u.orb.position.y=u.orbY+Math.sin(t*2.4+a.phase)*.04+(by<0?by:0);u.orbGlow.position.y=u.orb.position.y;
  if(u.zz.visible){u.zz.position.y=u.zzY+((t*.5)%1)*.45;u.zz.material.opacity=1-((t*.5)%1);}
}

function parseReminder(raw){
  const t=norm(raw);let d=new Date();d.setSeconds(0,0);let dayGiven=false;
  if(/بعد بكره|بعد بكرة/.test(t)){d.setDate(d.getDate()+2);dayGiven=true;}else if(/بكره|بكرة|غدا/.test(t)){d.setDate(d.getDate()+1);dayGiven=true;}
  const days=['الاحد','الاثنين','الثلاثاء','الاربعاء','الخميس','الجمعه','السبت'];days.forEach((n,i)=>{if(!dayGiven&&t.includes(n)){let k=(i-d.getDay()+7)%7||7;d.setDate(d.getDate()+k);dayGiven=true;}});
  const m=t.match(/الساعه\s*(\d{1,2})(?::(\d{2}))?/);let h=null,mi=0;if(m){h=+m[1];mi=+(m[2]||0);}
  if(h!==null){if(/مساء|العصر|الليل|الظهر|بالليل|pm/.test(t)&&h<12)h+=12;if(/الظهر/.test(t)&&h===24)h=12;if(/الفجر|الصبح|صباح/.test(t)&&h===12)h=0;d.setHours(h,mi);}
  else return null;
  if(!dayGiven&&d<new Date())d.setDate(d.getDate()+1);
  const repeat=/كل يوم|يوميا/.test(t)?'daily':/كل اسبوع|اسبوعيا/.test(t)?'weekly':/كل شهر|شهريا/.test(t)?'monthly':/كل سنه|سنويا/.test(t)?'yearly':'none';
  const cat=/صيان|مكيف|سباك|فلتر|كهربائي|تصليح/.test(t)?'maint':/ام |امي|ابوي|ابوي|زوجت|العيال|ولد|بنت|اهل|عائل|عايل|مدرس|ميلاد/.test(t)?'family':'home';
  const call=/اتصل|اتصال|كلمني/.test(t);
  const DROP=['بعد بكرة','بعد بكره','بكرة','بكره','غداً','غدا','اليوم','الليلة','العصر','الظهر','المغرب','بالليل','الليل','مساءً','مساء','صباحاً','صباحا','الصبح','الفجر','واتصل علي','اتصل علي','واتصل','كلمني','يومياً','يوميا','أسبوعياً','اسبوعيا','شهرياً','شهريا','سنوياً','سنويا'];
  let title=' '+raw+' ';
  title=title.replace(/^\s*(ذكّرني|ذكرني|تذكير)\s*(ب(?!كر|عد\s)(?=\S))?/,' ').replace(/(موعد)\s*/,' ').replace(/كل\s+(يوم|اسبوع|أسبوع|شهر|سنة|سنه)/g,' ').replace(/يوم\s+(ال)?(أحد|احد|اثنين|إثنين|ثلاثاء|أربعاء|اربعاء|خميس|جمعة|جمعه|سبت)/g,' ').replace(/الساع[ةه]\s*\d{1,2}(:\d{2})?/g,' ');
  for(const w of DROP)title=title.split(' '+w+' ').join(' ');
  title=title.replace(/\s+/g,' ').trim();
  if(!title)title='موعد';
  const pad=n=>String(n).padStart(2,'0');
  return {title,at:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,repeat,cat,lead:cat==='maint'&&repeat==='none'?60:0,call};
}

let queue=Promise.resolve(),pending=0;
function enqueue(fn){pending++;queue=queue.then(fn).catch(e=>{console.error(e);sys('error: '+e.message);}).finally(()=>pending--);}
const norm=s=>s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function ask(text){
  feed('',text,'me');const t=norm(text);
  const who=Object.values(AGENTS).sort((a,b)=>Math.max(...b.keys.map(k=>k.length))-Math.max(...a.keys.map(k=>k.length))).find(a=>a.keys.some(k=>t.includes(norm(k))));
  if(who&&/(شنو|وش|ايش|شو|كيف) ?(صار|الوضع|سويت|عندك|اخبار)/.test(t)){
    enqueue(async()=>{await say(who.id,`${who.last} (حالتي: ${STATUS[who.status][0]})`,2200);});return;}
  const num=+(t.match(/\d+/)||[0])[0];
  let job=null;
  if(/^ذكرني|^ذكّرني|موعد|^تذكير/.test(t)){
    const r=parseReminder(text);
    if(!LIVE.on){enqueue(()=>say('home','المواعيد تنحفظ في نسخة البيت (localhost أو Tailscale). هنا تجربة بس',2400));return;}
    if(!r){enqueue(()=>say('home','قل لي الوقت، مثلاً: ذكرني بكرة الساعة 5 العصر صيانة المكيف',2600));return;}
    feed('المدير العام','حوّلتها لمدير البيت.');

    api('api/home',{action:'add',...r}).then(h=>{applyHome(h);feed('مدير البيت',`حفظت: ${r.title} · ${fmtWhen(r.at)}${r.repeat!=='none'?' · '+REPS[r.repeat]:''}${r.call?' · 📞 وبتصل عليك':''} ✓`);enqueue(()=>say('home','حفظت الموعد ✓',1200));}).catch(e=>feed('مدير البيت','ما انحفظ: '+e.message));
    return;}
  if(/(وش|ايش|شنو) (عندي|مواعيدي|المواعيد)|مواعيدي/.test(t)){enqueue(()=>say('home',HOMEDATA.items.length?'الجاية: '+HOMEDATA.items.slice(0,3).map(r=>`${r.title} (${fmtWhen(r.at)})`).join('، '):'ما عندك مواعيد محفوظة',3000));return;}
  if(/ماجستير|مرشد|ماده|مادة|المواد|اختبار|دراس|محاضر|محور|واجب|mba/i.test(t)&&!/فاتور|طباع|اطبع/.test(t)){
    const n=+(t.match(/\d+/)||[0])[0];
    if(/خلصت|انهيت|خلصنا|سويت|حليت/.test(t))job=()=>SC.msDone(/اختبار|امتحان|كويز/.test(t)?'exam':/واجب|اساينمنت|assignment/.test(t)?'assignment':'lecture');

    else if(/رابط|لينك|موقع/.test(t))job=()=>say('adv','البرنامج: MBA Standard – Intake 26 على بوابة IBA London. المحتوى ورا تسجيل الدخول، فأنت تفتحه وأنا أتابع تقدمك',2600);
    else job=()=>SC.msStatus();
    feed('المدير العام','حوّلتها للمرشد الأكاديمي.');enqueue(job);return;}
  // printer control runs right away, not behind the agents' animation queue
  if(/(وقف|ايقاف|اوقف|بوز|كمل|استانف).*(طباع|طابع)/.test(t)||/(طباع|طابع).*(وقف|ايقاف)/.test(t)){enqueue(()=>say('prt','الطابعة ما تقبل أوامر من العمارة. وقّفها أو كمّلها من شاشتها أو من Bambu Handy، وأنا أتابع وأبلغك',2600));return;}

  else if(/فاتور|كهرب|انترنت|سداد/.test(t)){const nm=/انترنت/.test(t)?'الإنترنت':/موي|مياه/.test(t)?'المياه':'الكهرباء';job=()=>SC.bill(nm,num||420);}

  else if(/صيانه|مكيف|سباك|كهربائي|تصليح/.test(t)){const it=/مكيف/.test(t)?'المكيف':/سباك|موي/.test(t)?'السباكة':'البيت';job=()=>SC.maintenance(it);}
  else if(/رحله|سفر|سافر|عطله/.test(t)){const m=text.match(/رحلة\s+(\S+)/)||text.match(/الى\s+(\S+)/)||text.match(/إلى\s+(\S+)/);job=()=>SC.trip(m?m[1]:'العلا');}
  else if(/تقرير|ابديت|أبديت|ملخص|تحديث/.test(t))job=()=>SC.report();
  else if(/ناموا|نوم|ارتاحوا/.test(t))job=async()=>{Object.keys(AGENTS).forEach(id=>{if(id!=='ceo')setStatus(id,'sleep');});await say('ceo','الكل نام. أصحيهم أول ما يجي شغل');};
  if(!job){enqueue(()=>say('ceo','جرّب: اطبع لي رقم 21 · وصلت فاتورة الكهرباء 420 · المكيف يحتاج صيانة · خطط رحلة العلا · صمم لي حامل جوال · أبديت',2600));return;}
  if(pending)feed('المدير العام',`تمام، حطيته في الطابور (${pending} قبله).`);else feed('المدير العام','تمام، أوزعه الحين.');
  enqueue(job);
}

const STATE_MAP={RUNNING:'printing',PREPARE:'printing',SLICING:'printing',FINISH:'done',FAILED:'stuck',IDLE:'idle'};
let lastSlicerDraw=0;
function applyPrinter(d){
  printer.live=d;let st=STATE_MAP[d.state]||'idle';if(d.state==='PAUSE')st=d.error?'stuck':'paused';
  printer.state=st;printer.activeSpool=d.tray!=null&&+d.tray>=0&&+d.tray<4?+d.tray:-1;
  if(Array.isArray(d.trays))d.trays.forEach((t,i)=>{if(!printer.spools[i]||!t)return;const g=printer.spoolGroups[i];
    if(t.empty){g.visible=false;}else{g.visible=true;if(t.color)printer.spools[i].material.color.set(t.color);}});
  if(d.pct!=null)setPrintProgress(Math.max(0,Math.min(1,d.pct/100)));
  setPrinterLed({printing:'#46b4ff',done:'#3fe08c',idle:'#3fe08c',paused:'#ffc657',stuck:'#ff4f6a'}[st]);
  const a=AGENTS.prt;if(a.atHome!==false&&a.status!=='err'){const want=st==='printing'?'busy':st==='stuck'?'err':a.status==='busy'?'idle':a.status;if(want!==a.status)setStatus('prt',want);}
  const now=performance.now();if(now-lastSlicerDraw>1500){lastSlicerDraw=now;updateTV('slicer');}
  updatePrinterCard();}
async function printerCmd(cmd){
  if(!LIVE.printer){await say('prt','الطابعة مو مربوطة. شغّل الجسر على الكمبيوتر وحط بيانات الطابعة',2200);return;}
  const want=cmd==='pause'?'PAUSE':'RUNNING',before=printer.live&&printer.live.state;
  if(before===want){await say('prt',cmd==='pause'?'الطابعة واقفة أصلاً':'الطابعة شغالة أصلاً',1600);return;}
  setStatus('prt','busy');
  try{await api('api/printer',{cmd});}catch(e){await say('prt','ما وصل الأمر للطابعة: '+e.message,2200);setStatus('prt','idle');return;}
  await say('prt',cmd==='pause'?'أرسلت أمر الإيقاف المؤقت…':'أرسلت أمر الإكمال…',1200);
  const t0=Date.now();while(Date.now()-t0<10000){if(printer.live&&printer.live.state===want)break;await sleep(500);}
  if(printer.live&&printer.live.state===want){await say('prt',cmd==='pause'?'وقفت الطباعة مؤقتاً ✓':'كملت الطباعة ✓',1600);setStatus('prt','busy');}
  else{await say('prt','الطابعة استلمت الأمر بس ما نفذته. غالباً تحتاج تفعيل LAN Only و Developer Mode عشان تقبل الأوامر من برا',3200);setStatus('prt','idle');}
}
function onLiveEvent(ev){
  sys(`live ${ev.type}${ev.name?' · '+ev.name:''}`);
  if(ev.type==='cmd_result'&&ev.result&&!/success/i.test(ev.result)){say('prt',`الطابعة رفضت أمر ${ev.cmd==='pause'?'الإيقاف':'الإكمال'}${ev.reason?': '+ev.reason:''}`,3000);return;}
  if(ev.type==='print_start')enqueue(()=>SC.liveStart(ev.name||'قطعة'));
  else if(ev.type==='print_done')enqueue(()=>SC.liveDone(ev.name||'القطعة',ev.whatsapp));
  else if(ev.type==='print_failed')enqueue(()=>SC.liveFail(ev));
  else if(ev.type==='reminder')enqueue(()=>SC.liveReminder(ev));
  else if(ev.type==='mail_bill')enqueue(()=>SC.liveBill(ev));
  else if(ev.type==='mail_iba')enqueue(()=>SC.liveIba(ev));
  else if(ev.type==='mail_new'){AGENTS.mail.last=`آخر إيميل: ${ev.subject}`;}
}
async function tryLive(){
  if(!/^https?:$/.test(location.protocol))return;

  if(!st||!st.bridge)return;
  LIVE.on=true;LIVE.printer=!!st.config.printer;LIVE.whatsapp=!!st.config.whatsapp;
  applyFinance(st.finance);applyMasters(st.masters);applyMail(st.mail);applyHome(st.home);if(st.printer&&st.printer.state)applyPrinter(st.printer);setLiveBadge(true);
  const es=new EventSource('events');
  es.addEventListener('printer',e=>applyPrinter(JSON.parse(e.data)));
  es.addEventListener('finance',e=>applyFinance(JSON.parse(e.data)));

  es.addEventListener('home',e=>applyHome(JSON.parse(e.data)));

/* ---------------- voice input (Web Speech API) ---------------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recLang='ar-SA',recFinal=false;
try{recLang=localStorage.getItem('fayez-hq-lang')||'ar-SA';}catch(e){}
function paintLang(){$('langBtn').textContent=recLang.startsWith('ar')?'ع':'EN';$('langBtn').title=recLang.startsWith('ar')?'الميكروفون: عربي (اضغط للإنجليزي)':'Mic: English (tap for Arabic)';}
$('langBtn').onclick=()=>{recLang=recLang.startsWith('ar')?'en-US':'ar-SA';try{localStorage.setItem('fayez-hq-lang',recLang);}catch(e){}paintLang();};
function setMic(on){$('micBtn').setAttribute('aria-pressed',String(on));$('q').placeholder=on?(recLang.startsWith('ar')?'أسمعك… تكلم':'Listening…'):'اكتب للمدير العام… أو @ لأي وكيل';}
let recTimer=null;
function micReset(){clearTimeout(recTimer);if(rec){try{rec.onend=null;rec.onresult=null;rec.onerror=null;rec.abort();}catch(e){}}rec=null;setMic(false);}
$('micBtn').onclick=()=>{
  if(rec){const v=$('q').value.trim(),fin=recFinal;micReset();if(fin&&v){ask(v);$('q').value='';}return;}  // second tap always stops
  if(!SR){feed('المدير العام','المتصفح هذا ما يدعم التحويل من صوت لنص. استخدم Chrome أو Edge على الكمبيوتر، أو Safari على الآيفون. وتقدر تستخدم مايك الكيبورد.');return;}
  if(!LIVE.on&&window.self!==window.top){feed('المدير العام','الميكروفون يشتغل في نسخة البيت (localhost أو رابط Tailscale). هنا استخدم مايك الكيبورد.');return;}
  if(!window.isSecureContext){feed('المدير العام','الميكروفون يحتاج رابط آمن (https أو localhost). من الجوال افتح البيت عن طريق رابط Tailscale.');return;}
  try{rec=new SR();}catch(e){rec=null;feed('المدير العام','ما قدرت أشغّل الميكروفون هنا.');return;}
  rec.lang=recLang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;recFinal=false;
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)recFinal=true;}$('q').value=t;};
  rec.onerror=e=>{const m={'not-allowed':'اسمح للصفحة تستخدم الميكروفون من إعدادات المتصفح وجرب مرة ثانية.','service-not-allowed':'الميكروفون ممنوع هنا. من الآيفون تأكد إن الإملاء (Dictation) مفعّل.','no-speech':'ما سمعت شي، جرب مرة ثانية.','audio-capture':'ما لقيت ميكروفون في الجهاز.','network':'التحويل من صوت لنص يحتاج إنترنت.'}[e.error];if(m)feed('المدير العام',m);micReset();};
  rec.onend=()=>{const v=$('q').value.trim(),fin=recFinal;micReset();if(fin&&v){ask(v);$('q').value='';}};
  try{rec.start();setMic(true);recTimer=setTimeout(micReset,15000);}catch(e){micReset();}  // hard stop after 15s
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rec)micReset();});

// iPhone/iPad: Apple blocks web speech in home-screen apps and it is unreliable in Safari, so use the keyboard's dictation instead

/* ---------------- day / night ---------------- */
let day=false;
function applyDay(){
  $('dayBtn').textContent=day?'☀ نهاري':'☾ ليلي';$('dayBtn').setAttribute('aria-pressed',String(day));
  hemi.intensity=day?.95:.32;moon.intensity=day?.9:.25;moon.color.set(day?'#fff6e6':'#9fb2ff');
  scene.background.copy(day?DAY_BG:NIGHT_BG);scene.fog.color.copy(scene.background);
  roomLights.forEach(l=>{l.intensity=day?.5:1.0;l.userData.base=l.intensity;});lampGlows.forEach(g=>g.visible=!day||g.type==='Sprite');
  windows.forEach(w=>w.material.map=day?winDay:winNight);

}

/* ---------------- picking printer ---------------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mp,camera);
  if(ray.intersectObject(printer.g,true).length)openPrinter();});

/* ---------------- busy rooms ---------------- */
const BUSY_COL={busy:new THREE.Color('#46b4ff'),err:new THREE.Color('#ff4f6a')};
function roomActivity(t){
  const k=.5+.5*Math.sin(t*4);
  for(const r of ROOMS){
    let st=null;
    for(const a of Object.values(AGENTS)){
      if(a.status!=='busy'&&a.status!=='err')continue;
      const p=a.g.position,inside=a.f===r.f&&p.x>=r.x0&&p.x<r.x1&&p.z<CORR-.2;
      if(a.room===r.id||inside){st=a.status==='err'?'err':(st||'busy');}
    }
    if(r.room_state!==st){r.room_state=st;if(st)[r.strip,r.halo,r.frame,r.wash].forEach(m=>m.material.color.copy(BUSY_COL[st]));
      r.chip.hidden=!st;if(st){r.chip.textContent=st==='err'?`⚠ ${r.ar} · خطأ`:`● ${r.ar} · مشغول`;r.chip.style.setProperty('--c',st==='err'?'#ff4f6a':'#2b7cff');}}
    if(st){const v=v3.copy(r.chipPos).project(camera),W=stage.clientWidth,H=stage.clientHeight;const off=v.z>1||Math.abs(v.x)>1.05||Math.abs(v.y)>1.05;
      r.chip.style.visibility=off?'hidden':'visible';r.chip.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-100%,-50%)`;}
    r.strip.material.opacity=st?.6+.4*k:0;
    r.halo.material.opacity=st?.08+.08*k:0;
    r.frame.material.opacity=st?.5+.5*k:0;
    r.wash.material.opacity=st?.07+.07*k:0;
    r.rugMat.emissiveIntensity=st?.3+.25*k:.18;
    const base=r.light.userData.base||1.25;r.light.intensity=st?base*1.3:base;
  }
  // floor buttons: badge with the number of busy departments on that floor (red if any has an error)
  const fl={},all={n:0,err:false,names:[]};
  for(const r of ROOMS){if(!r.room_state)continue;const o=fl[r.f]||(fl[r.f]={n:0,err:false,names:[]});o.n++;o.names.push(r.ar);all.n++;all.names.push(r.ar);if(r.room_state==='err'){o.err=true;all.err=true;}}
  const key=JSON.stringify([fl,all.n,all.err]);
  if(key!==floorKey){floorKey=key;
    $('floors').querySelectorAll('[data-f]').forEach(b=>{const o=b.dataset.f===''?all:fl[+b.dataset.f];const on=!!(o&&o.n);
      b.classList.toggle('on',on);b.style.setProperty('--c',on&&o.err?'#ff4f6a':'#2b7cff');b.querySelector('.bd').textContent=on?o.n:'';
      b.title=on?`مشغول: ${o.names.join('، ')}`:'';b.setAttribute('aria-label',b.firstChild.textContent+(on?` — ${o.n} مشغول`:''));});}
}
let floorKey='';

/* ---------------- resize / loop ---------------- */
const TARGET=new THREE.Vector3(.8,8.4,0);
let homeDist=40,framed=false;const HOME_DIR=new THREE.Vector3(.38,.3,1).normalize();
function frame(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);if(composer){composer.setSize(w,h);}
  camera.aspect=w/h;
  const dockEl=document.querySelector('.dock'),fl=$('floors');
  if(w<=640&&fl.parentNode!==dockEl)dockEl.insertBefore(fl,$('quick'));else if(w>640&&fl.parentNode===dockEl)$('app').appendChild(fl);
  document.documentElement.style.setProperty('--dockH',(h-dockEl.getBoundingClientRect().top)+'px');
  const top=document.querySelector('.top').getBoundingClientRect().bottom, bot=h-document.querySelector('.feed').getBoundingClientRect().top+10;
  const free=Math.max(h*.35,h-top-bot);camera.setViewOffset(w,h,0,(bot-top)/2,w,h);camera.updateProjectionMatrix();
  const vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));const needH=(19.5)/2/vf*(h/free), needW=(w<600?20.5:23)/2/(vf*camera.aspect);
  const dist=Math.max(needH,needW)*1.02+4;
  const dir=new THREE.Vector3(.38,.3,1).normalize();
  homeDist=dist;controls.minDistance=4.5;controls.maxDistance=dist*1.3;
  if(!framed){framed=true;controls.target.copy(TARGET);camera.position.copy(TARGET).addScaledVector(dir,dist);controls.update();}
}
addEventListener('resize',frame);frame();
function flyTo(tgt,dist,dir){const st=controls.target.clone(),sp=camera.position.clone();const d=(dir||sp.clone().sub(st)).clone().normalize();const ep=tgt.clone().addScaledVector(d,dist);
  return tween(.9,k=>{const e=ease(k);controls.target.lerpVectors(st,tgt,e);camera.position.lerpVectors(sp,ep,e);});}
const FLOORS=[['الكل',null],['الإدارة',4],['المالية',3],['الطباعة',2],['البيت',1],['الاستقبال',0]];
$('floors').innerHTML=FLOORS.map(([n,f])=>`<button data-f="${f===null?'':f}" aria-pressed="${f===null}">${n}<span class="bd"></span></button>`).join('')+'<div class="zm"><button data-z="in" aria-label="تقريب">+</button><button data-z="out" aria-label="تبعيد">−</button></div>';
$('floors').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{$('floors').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  if(b.dataset.f==='')flyTo(TARGET.clone(),homeDist,HOME_DIR);else flyTo(new THREE.Vector3(.8,fy(+b.dataset.f)+1.6,0),Math.max(10,homeDist*.36));});
$('floors').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const d=camera.position.distanceTo(controls.target);flyTo(controls.target.clone(),Math.min(controls.maxDistance,Math.max(controls.minDistance,d*(b.dataset.z==='in'?.75:1.33))));});
const clampV=new THREE.Vector3();
function clampTarget(){const T=controls.target;clampV.set(Math.min(10,Math.max(-8.5,T.x))-T.x,Math.min(17.5,Math.max(.6,T.y))-T.y,Math.min(3,Math.max(-3,T.z))-T.z);if(clampV.lengthSq()>0){T.add(clampV);camera.position.add(clampV);}}
const clock=new THREE.Clock(),v3=new THREE.Vector3();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.sec);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.r();}}
  for(const a of Object.values(AGENTS))animateAgent(a,dt,t);
  printerTick(t);roomActivity(t);holo.rotation.y+=dt*.8;holo.rotation.x+=dt*.3;globe.rotation.y+=dt*.3;
  controls.update();clampTarget();
  composer?composer.render():renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const a of Object.values(AGENTS)){
    v3.copy(a.g.position);v3.y+=a.mode==='sit'||a.mode==='type'||a.mode==='sleep'?a.g.userData.labelSit:a.g.userData.labelStand;v3.project(camera);
    a.el.hidden=v3.z>1||Math.abs(v3.x)>1.15||Math.abs(v3.y)>1.15;a.el.style.transform=`translate(${(v3.x+1)/2*w}px,${(1-v3.y)/2*h}px) translate(-50%,-100%)`;
  }
  requestAnimationFrame(loop);
}

sys(matchMedia('(pointer: coarse)').matches?'إصبع واحد: تحريك · إصبعين: زوم وتدوير':'سحب: تدوير · كليك يمين: تحريك · العجلة: زوم');
