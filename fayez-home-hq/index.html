<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>بيت فايز HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D cross-section of the house tower; header + agent pipeline float on top, chat with the general manager docked at the bottom, agent/printer cards slide over the scene. Single warm-night look by design (day mode only changes the 3D lighting). */
:root{
  --bg:#07080d; --glass:#12141cd9; --glass2:#1a1d28f0; --line:#2a2f3f; --ink:#f3ede0; --mute:#9a9484;
  --gold:#ffc657; --gold2:#ff9f2e; --ok:#3fe08c; --busy:#46b4ff; --done:#ffc657; --sleep:#a98bff; --bad:#ff4f6a;
  --ui:"Readex Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui)}
body{overflow:hidden}
#app{position:relative;height:100%;direction:rtl}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:absolute;z-index:5;pointer-events:none}
.ui>*{pointer-events:auto}
/* header */
.top{top:0;left:0;right:0;padding-block:10px 0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px;background:linear-gradient(#07080df2,#07080d00)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-inline-end:auto}
.brand b{font-size:1.1rem;letter-spacing:.3px}
.brand b span{color:var(--gold)}
.brand small{font:500 .62rem var(--mono);color:var(--mute);letter-spacing:1.6px;direction:ltr;text-align:right}
.pill{font:500 .72rem var(--ui);display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(8px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill em{font:700 .72rem var(--mono);font-style:normal;color:var(--c)}
button{font-family:var(--ui);cursor:pointer}
.btn{font:600 .74rem var(--ui);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);backdrop-filter:blur(8px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1800;border:0}
.btn:focus-visible,.chipq:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* pipeline */
.pipe{direction:ltr;display:flex;align-items:center;gap:0;padding:8px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);max-width:560px;width:100%;justify-self:center;transition:opacity .3s}
.pipe.idle{opacity:.55}
.node{display:grid;justify-items:center;gap:4px;flex:none;width:58px}
.node .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1b2030;border:1px solid var(--line);color:var(--mute);transition:.3s}
.node .ic svg{width:15px;height:15px}
.node span{font:700 .5rem var(--mono);letter-spacing:.8px;color:var(--mute);white-space:nowrap}
.node.on .ic{background:#2b7cff;border-color:#6aa6ff;color:#fff;box-shadow:0 0 14px #2b7cffaa}
.node.on span{color:#cfe0ff}
.node.cur .ic{animation:pulse 1s infinite}
.link{flex:1;height:2px;background:var(--line);position:relative;min-width:8px}
.link i{position:absolute;inset:0;width:0;background:#2b7cff;box-shadow:0 0 8px #2b7cff;transition:width .5s}
.link.on i{width:100%}
@keyframes pulse{50%{box-shadow:0 0 0 6px #2b7cff33,0 0 18px #2b7cffcc}}
/* labels */
.tag{position:absolute;left:0;top:0;z-index:3;display:grid;justify-items:center;gap:4px;white-space:nowrap;cursor:pointer;will-change:transform}
.tag .nm{font:600 .62rem var(--ui);display:flex;align-items:center;gap:5px;padding:3px 8px 3px 7px;border-radius:999px;background:#0b0d14d9;border:1px solid #3a3426;color:var(--ink)}
.tag .nm i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.tag .nm svg{width:9px;height:9px;opacity:.6}
.tag.sel .nm{border-color:var(--gold);box-shadow:0 0 12px #ffc65766}
.tag .say{font:600 .68rem/1.45 var(--ui);background:#fff8ea;color:#231a08;padding:5px 9px;border-radius:10px;max-width:190px;white-space:normal;text-align:center;box-shadow:0 6px 20px #0008;position:relative}
.tag .say::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff8ea}
.tag:focus-visible .nm{outline:2px solid var(--gold)}
/* cards */
.card{position:absolute;z-index:6;top:132px;left:max(14px,env(safe-area-inset-left,0px));width:min(300px,calc(100% - 28px));background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 20px 50px #000a;display:grid;gap:10px}
.card h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:8px}
.card h3 i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card .x{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#0006;color:var(--ink)}
.card .sub{font:500 .62rem var(--mono);color:var(--mute);letter-spacing:1px;direction:ltr;text-align:right}
.spec{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spec div{background:#0c0e15;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.spec b{display:block;font:700 .82rem var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.spec span{font:500 .55rem var(--mono);color:var(--mute);letter-spacing:.6px}
.bar{height:6px;border-radius:3px;background:#0c0e15;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s}
.hist{display:grid;gap:4px;font-size:.72rem;color:var(--mute);max-height:120px;overflow:auto}
.hist div{padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
/* dock */
.dock{bottom:0;left:0;right:0;padding-block:24px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px;background:linear-gradient(#07080d00,#07080df5 38%)}
.feed{display:grid;gap:5px;max-height:16vh;overflow-y:auto;font-size:.76rem;line-height:1.5;max-width:620px;width:100%;justify-self:center;mask-image:linear-gradient(transparent,#000 30%)}
.msg{padding:5px 10px;border-radius:12px;background:#151824e6;border:1px solid var(--line);justify-self:start;max-width:92%}
.msg b{color:var(--gold);font-weight:600}
.msg.me{background:#2b7cff;border-color:#2b7cff;color:#fff;justify-self:end}
.msg.sys{background:none;border:0;color:var(--mute);font:500 .66rem var(--mono);direction:ltr;justify-self:center}
.quick{display:flex;gap:6px;overflow-x:auto;max-width:620px;width:100%;justify-self:center;scrollbar-width:none}
.chipq{flex:none;font:500 .72rem var(--ui);padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
form{display:flex;gap:8px;max-width:620px;width:100%;justify-self:center}
.inp{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#10121a;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.inp input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:400 .86rem var(--ui);padding:7px 0}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--gold)}
.mic{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1800;display:grid;place-items:center;flex:none}
.mic svg{width:16px;height:16px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.8rem;z-index:1}
@media (max-width:520px){.node{width:44px}.node span{font-size:.44rem}.card{top:150px}}
@media (prefers-reduced-motion:reduce){.node.cur .ic{animation:none}}
</style>

<div id="app">
  <div id="stage"><div id="loading">يجهّز البيت…</div></div>

  <div class="ui top">
    <div class="row">
      <div class="brand"><b>بيت <span>فايز</span> HQ</b><small>FAYEZ HOME · 8 AGENTS</small></div>
      <button class="btn" id="dayBtn" aria-pressed="false">☾ ليلي</button>
      <button class="btn gold" id="updBtn">أبديت</button>
    </div>
    <div class="row" id="counts"></div>
    <div class="pipe idle" id="pipe"></div>
  </div>

  <div class="card" id="card" hidden></div>

  <div class="ui dock">
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form id="form">
      <div class="inp"><input id="q" placeholder="اكتب للمدير العام… أو @ لأي وكيل" autocomplete="off" aria-label="رسالة للمدير العام">
        <button class="mic" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* =====================================================================
   بيت فايز HQ
   Event API (for the real bridge later):
     tower.emit({type:'print', part:21})      Bambu A1 print request
     tower.emit({type:'stuck'})                A1 camera detected a failure
     tower.emit({type:'bill', name:'الكهرباء', amount:420})
     tower.emit({type:'maintenance', item:'المكيف'})
     tower.emit({type:'trip', place:'العلا'})
     tower.emit({type:'design', item:'حامل جوال'})
     tower.emit({type:'report'})
   ===================================================================== */
const $=id=>document.getElementById(id);
const stage=$('stage');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,reduced?Math.min(ms,400):ms));
const TAU=Math.PI*2;
let cardFor=null;

/* ---------------- renderer / scene ---------------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement); $('loading').remove();
const scene=new THREE.Scene();
const NIGHT_BG=new THREE.Color('#07080d'), DAY_BG=new THREE.Color('#1c2433');
scene.background=NIGHT_BG.clone();
scene.fog=new THREE.Fog('#07080d',60,120);
const camera=new THREE.PerspectiveCamera(30,1,0.1,300);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.enablePan=false;
controls.minPolarAngle=Math.PI*.22; controls.maxPolarAngle=Math.PI*.54;
controls.minAzimuthAngle=-Math.PI*.42; controls.maxAzimuthAngle=Math.PI*.42;
controls.rotateSpeed=.6; controls.zoomSpeed=.8;
const hemi=new THREE.HemisphereLight('#bcc6ff','#1a1208',.32); scene.add(hemi);
const moon=new THREE.DirectionalLight('#9fb2ff',.25); moon.position.set(-10,30,20); scene.add(moon);
const fill=new THREE.DirectionalLight('#ffd9a8',.18); fill.position.set(12,8,30); scene.add(fill);

let composer=null, bloom=null;
try{
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.75,.45,.72);
  composer.addPass(bloom);
}catch(e){composer=null;}

/* ---------------- helpers ---------------- */
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.05},o));
const glowMat=c=>new THREE.MeshBasicMaterial({color:c});
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m;}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,parent=scene,seg=20){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);parent.add(m);return m;}
function sph(r,mat,x=0,y=0,z=0,parent=scene,seg=20){const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.round(seg*.75)),mat);m.position.set(x,y,z);parent.add(m);return m;}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.userData={c,g,draw};return t;}
function redraw(t){const {c,g,draw}=t.userData;g.clearRect(0,0,c.width,c.height);draw(g,c.width,c.height);t.needsUpdate=true;}
const glowTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
function glow(color,size,x,y,z,parent=scene,op=.8){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);s.position.set(x,y,z);parent.add(s);return s;}

/* ---------------- building ---------------- */
const FH=3.4, X0=-8, X1=8, ZB=-3.5, ZF=3.5, CORR=2.45, EX=9.75, EDOOR=8.55, NF=5;
const fy=f=>f*FH;
const woodTex=canvasTex(512,512,(g,w,h)=>{
  const rows=10, ph=h/rows;
  for(let r=0;r<rows;r++){let x=-(r%2)*90;while(x<w){const len=140+Math.random()*120;const l=22+Math.random()*10;g.fillStyle=`hsl(28,${38+Math.random()*10}%,${l}%)`;g.fillRect(x,r*ph,len-2,ph-2);
    g.strokeStyle='rgba(0,0,0,.18)';for(let k=0;k<5;k++){g.beginPath();const yy=r*ph+Math.random()*ph;g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+3,x+len*.6,yy-3,x+len,yy);g.stroke();}x+=len;}}
});
woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping; woodTex.repeat.set(3,1.4);
const wallTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#2a1f19';g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:200},120,${Math.random()*.035})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);} });
wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping; wallTex.repeat.set(4,1);
const floorMat=M('#ffffff',{map:woodTex,roughness:.55});
const wallMat=M('#ffffff',{map:wallTex,roughness:.9});
const slabMat=M('#16120e',{roughness:.6});
const neon=glowMat('#ffc657');
const neonSoft=glowMat('#ff9f2e');

const ROOMS=[
  {id:'lobby', f:0,x0:-8,x1:8, en:'WHATSAPP · LOBBY', ar:'الاستقبال والواتساب', rug:'#14593a', lamp:'#ffd9a0'},
  {id:'home',  f:1,x0:-8,x1:0, en:'HOME', ar:'إدارة البيت', rug:'#9c4421', lamp:'#ffcf8a'},
  {id:'family',f:1,x0:0, x1:8, en:'FAMILY · TRAVEL', ar:'العائلة والسفر', rug:'#5d2f91', lamp:'#ffd9b0'},
  {id:'print', f:2,x0:-8,x1:0, en:'PRINT LAB', ar:'غرفة الطباعة', rug:'#163f9e', lamp:'#ffe2b0'},
  {id:'design',f:2,x0:0, x1:8, en:'DESIGN STUDIO', ar:'التصميم', rug:'#a3245a', lamp:'#ffd0c0'},
  {id:'finance',f:3,x0:-8,x1:0,en:'FINANCE', ar:'المالية', rug:'#0d7068', lamp:'#ffe7b8'},
  {id:'mail',  f:3,x0:0, x1:8, en:'EMAILS', ar:'الإيميلات', rug:'#204fa8', lamp:'#ffdcae'},
  {id:'ceo',   f:4,x0:-8,x1:8, en:'MANAGEMENT', ar:'المدير العام', rug:'#6e5214', lamp:'#ffd38a'},
];
const roomById=Object.fromEntries(ROOMS.map(r=>[r.id,r]));
const roomLights=[], lampGlows=[], windows=[], signTexes=[];

function signTex(r){return canvasTex(512,160,(g,w,h)=>{
  g.textAlign='right';g.textBaseline='alphabetic';
  g.font='700 54px "JetBrains Mono", monospace';g.fillStyle='#ffd27a';g.shadowColor='#ff9f2e';g.shadowBlur=18;g.fillText(r.en,w-14,64);
  g.shadowBlur=8;g.font='600 46px "Readex Pro", sans-serif';g.fillStyle='#fff1d6';g.fillText(r.ar,w-14,128);
});}
function windowTex(night){return canvasTex(256,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  if(night){gr.addColorStop(0,'#0b1430');gr.addColorStop(1,'#1d2a55');}else{gr.addColorStop(0,'#5fa8e8');gr.addColorStop(1,'#cfe6f7');}
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  if(night){for(let i=0;i<60;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.9})`;g.fillRect(Math.random()*w,Math.random()*h*.7,1.6,1.6);}g.fillStyle='#f6f0d8';g.beginPath();g.arc(190,60,20,0,TAU);g.fill();g.fillStyle='#0b1430';g.beginPath();g.arc(200,54,18,0,TAU);g.fill();}
  else{g.fillStyle='rgba(255,255,255,.85)';[[60,70],[160,110]].forEach(([x,y])=>{g.beginPath();g.ellipse(x,y,34,12,0,0,TAU);g.fill();});}
  // skyline
  g.fillStyle=night?'#070b1c':'#7d98b4';for(let x=0;x<w;x+=22){const bh=30+((x*37)%70);g.fillRect(x,h-bh,18,bh);}
  if(night){g.fillStyle='#ffd27a';for(let i=0;i<40;i++){g.fillRect(Math.random()*w,h-Math.random()*60,2,3);}}
  g.strokeStyle='#3a2a1a';g.lineWidth=10;g.strokeRect(0,0,w,h);g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.lineWidth=6;g.stroke();
});}
const winNight=windowTex(true), winDay=windowTex(false);

function pendant(x,y,z,color,room){
  cyl(.012,.012,.55,M('#111'),x,y-.27,z);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.12,.34,.28,24,1,true),M('#1c1712',{side:THREE.DoubleSide,metalness:.6,roughness:.4}));
  shade.position.set(x,y-.62,z);scene.add(shade);
  sph(.09,glowMat(color),x,y-.7,z);
  const g=glow(color,1.6,x,y-.72,z,scene,.9); lampGlows.push(g);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.25,2.3,32,1,true),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.055,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  cone.position.set(x,y-1.85,z);scene.add(cone); lampGlows.push(cone);
}

ROOMS.forEach(r=>{
  const y=fy(r.f), w=r.x1-r.x0, cx=(r.x0+r.x1)/2;
  // floor + rug
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(w,ZF-ZB),floorMat);fl.rotation.x=-Math.PI/2;fl.position.set(cx,y+.101,0);scene.add(fl);
  const rugMat=M(r.rug,{roughness:.95,emissive:r.rug,emissiveIntensity:.18});
  const rug=new THREE.Mesh(new THREE.PlaneGeometry(w-2.2,3.6),rugMat);rug.rotation.x=-Math.PI/2;rug.position.set(cx,y+.11,-1.2);scene.add(rug);
  // back wall + sign + window
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(w,FH-.2),wallMat);wall.position.set(cx,y+FH/2,ZB);scene.add(wall);

const tweens=[];
function tween(sec,fn){if(reduced)sec=Math.min(sec,.05);return new Promise(r=>tweens.push({t:0,sec:Math.max(.001,sec),fn,r}));}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
async function face(a,ang){const s=a.g.rotation.y;let d=((ang-s+Math.PI)%TAU+TAU)%TAU-Math.PI;await tween(Math.abs(d)/7,k=>a.g.rotation.y=s+d*ease(k));}
async function walkTo(a,x,z){
  const p=a.g.position,sx=p.x,sz=p.z,d=Math.hypot(x-sx,z-sz);if(d<.02)return;
  a.mode='walk';a.atHome=false;await face(a,Math.atan2(x-sx,z-sz));
  await tween(d/2.1,k=>{p.x=sx+(x-sx)*k;p.z=sz+(z-sz)*k;});
}
let carFloor=0, lock=Promise.resolve();
async function moveCar(f){const sy=car.position.y,ty=fy(f)+.12,d=Math.abs(f-carFloor);carFloor=f;if(d)await tween(.7*d+.3,k=>car.position.y=sy+(ty-sy)*ease(k));}
async function ride(a,f){
  let rel;const prev=lock;lock=new Promise(r=>rel=r);await prev;
  await moveCar(a.f);await walkTo(a,EX,1.2);a.mode='ride';await face(a,-Math.PI/2);
  const sy=a.g.position.y,ty=fy(f)+.1,cs=car.position.y,ct=fy(f)+.12,d=Math.abs(f-a.f);
  await tween(.7*d+.3,k=>{const e=ease(k);a.g.position.y=sy+(ty-sy)*e;car.position.y=cs+(ct-cs)*e;});
  a.f=f;carFloor=f;await walkTo(a,EDOOR,CORR);rel();
}
async function go(id,f,x,z){
  const a=AGENTS[id];if(a.status==='sleep')await wake(id);if(a.status!=='err')setStatus(id,'busy');
  const p=a.g.position;
  if(a.f!==f||Math.abs(p.x-x)>.1||Math.abs(p.z-z)>.1){
    if(p.z<CORR-.1&&(a.f!==f||Math.abs(p.x-x)>2.2))await walkTo(a,p.x,CORR);
    if(a.f!==f){await walkTo(a,EDOOR,CORR);await ride(a,f);}
    if(Math.abs(a.g.position.x-x)>.05&&a.g.position.z>=CORR-.1)await walkTo(a,x,CORR);
    await walkTo(a,x,z);
  }
  a.mode='stand';
}
async function visit(id,targetId){const t=AGENTS[targetId];const off=id==='ceo'?0:(Object.keys(AGENTS).indexOf(id)%3-1)*.55;await go(id,t.f,t.home.x+off,-.15);await face(AGENTS[id],Math.PI);AGENTS[id].mode='talk';}
async function goHome(id,end='done'){const a=AGENTS[id];await go(id,a.home.f,a.home.x,a.home.z+.6);await walkTo(a,a.home.x,a.home.z);await face(a,0);a.atHome=true;a.mode='sit';setStatus(id,end);}
async function wake(id){const a=AGENTS[id];a.status='idle';a.g.userData.zz.visible=false;a.mode='sit';await say(id,'صحيت!',700);}
async function say(id,text,ms=1700){
  const a=AGENTS[id],b=a.el.querySelector('.say');b.textContent=text;b.hidden=false;const pm=a.mode;if(a.mode==='stand'||a.mode==='talk')a.mode='talk';
  feed(a.name,text);a.hist.unshift(text);a.hist=a.hist.slice(0,8);if(cardFor===id)openAgent(id,true);
  await sleep(ms);b.hidden=true;
}
function animateAgent(a,dt,t){
  const u=a.g.userData;a.phase+=dt;const ph=a.phase;
  let by=0,legX=0,armX=0,armXR=null,headX=0,headY=0;
  switch(a.mode){
    case 'walk':{const s=Math.sin(ph*9.5);legX=s*.65;armX=-s*.55;by=Math.abs(Math.cos(ph*9.5))*.06;break;}
    case 'sit':by=-.28;legX=-1.45;armX=-.35;headY=Math.sin(ph*.6)*.25;headX=Math.sin(ph*.9)*.04;break;
    case 'type':by=-.28;legX=-1.45;armX=-1.05;armXR=-1.05+Math.sin(ph*22)*.12;headX=.12+Math.sin(ph*3)*.03;headY=Math.sin(ph*.8)*.12;break;
    case 'sleep':by=-.3;legX=-1.45;armX=-1.2;headX=.55;break;
    case 'talk':armX=-.2;armXR=-.9+Math.sin(ph*5)*.35;headX=Math.sin(ph*6)*.08;by=Math.sin(ph*3)*.01;break;
    case 'ride':case 'stand':default:by=Math.sin(ph*2)*.012;armX=Math.sin(ph*2)*.04;
  }
  const L=.18; // smoothing
  u.body.position.y+=(by-u.body.position.y)*L*3;
  u.legs[0].rotation.x+=(legX-u.legs[0].rotation.x)*L*2.5;u.legs[1].rotation.x+=((a.mode==='walk'?-legX:legX)-u.legs[1].rotation.x)*L*2.5;
  u.arms[0].rotation.x+=((armXR!==null?armX+Math.sin(ph*22+1.5)*(a.mode==='type'?.12:0):armX)-u.arms[0].rotation.x)*L*2.5;
  u.arms[1].rotation.x+=((armXR!==null?armXR:(a.mode==='walk'?-armX:armX))-u.arms[1].rotation.x)*L*2.5;
  u.head.rotation.x+=(headX-u.head.rotation.x)*L;u.head.rotation.y+=(headY-u.head.rotation.y)*L;
  u.orb.position.y=2.08+Math.sin(t*2.4+a.phase)*.04+(by<-.1?-.28:0);u.orbGlow.position.y=u.orb.position.y;
  if(u.zz.visible){u.zz.position.y=1.7+((t*.5)%1)*.5;u.zz.material.opacity=1-((t*.5)%1);}
}

  <div style="font-size:.8rem;color:var(--mute)">${a.role}</div>
  <div class="hist">${(a.hist.length?a.hist:[a.last]).map(h=>`<div>${esc(h)}</div>`).join('')}</div>
  <div class="acts"><button class="btn" data-ask="@${a.name} وش صار؟">وش صار؟</button>${QUICK_FOR[id]?`<button class="btn gold" data-ask="${QUICK_FOR[id][1]}">${QUICK_FOR[id][0]}</button>`:''}</div>`;
  bindCard();
}
function openPrinter(){cardFor='printer';Object.values(AGENTS).forEach(x=>x.el.classList.remove('sel'));const c=$('card');c.hidden=false;c.style.setProperty('--c','var(--busy)');
  c.innerHTML=`<button class="x" aria-label="إغلاق">✕</button><h3><i></i>Bambu Lab A1</h3><div class="sub">256 × 256 × 256 mm · 500 mm/s · AMS lite</div>
  <div class="spec"><div><b id="pP">0%</b><span>PROGRESS</span></div><div><b id="pN">220°</b><span>NOZZLE</span></div><div><b id="pB">65°</b><span>BED</span></div></div>
  <div class="bar"><i id="pBar"></i></div><div class="sub" id="pS">IDLE</div>
  <div class="acts"><button class="btn gold" data-ask="اطبع لي القطعة رقم 21">اطبع قطعة</button><button class="btn" data-ask="الطابعة علقت">محاكاة عطل</button></div>`;
  bindCard();updatePrinterCard();}
function updatePrinterCard(){if(cardFor!=='printer')return;const p=Math.round(printer.progress*100);const e=id=>document.getElementById(id);if(!e('pP'))return;
  e('pP').textContent=p+'%';e('pBar').style.width=p+'%';e('pN').textContent=printer.state==='printing'?'220°':'28°';e('pB').textContent=printer.state==='printing'?'65°':'26°';
  e('pS').textContent={idle:'IDLE · READY',printing:`PRINTING · LAYER ${Math.round(p*1.6)}/160`,done:'FINISHED · REMOVE PART',stuck:'PAUSED · SPAGHETTI DETECTED'}[printer.state];}
function bindCard(){const c=$('card');c.querySelector('.x').onclick=closeCard;c.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>ask(b.dataset.ask));}
function closeCard(){cardFor=null;$('card').hidden=true;Object.values(AGENTS).forEach(x=>x.el.classList.remove('sel'));}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const QUICK_FOR={prt:['اطبع قطعة','اطبع لي القطعة رقم 21'],fin:['فاتورة جديدة','وصلت فاتورة الكهرباء 420'],mail:['إيميل جديد','وصلت فاتورة الكهرباء 420'],home:['صيانة','المكيف يحتاج صيانة'],fam:['رحلة','خطط لنا رحلة العلا'],des:['تصميم','صمم لي حامل جوال'],ceo:['أبديت','عطني التقرير اليومي'],wa:['اختبار','عطني التقرير اليومي']};

/* ---------------- scenarios ---------------- */
async function whatsapp(text){HOME.wa=(HOME.wa||[]).concat(text);updateTV('whatsapp');await say('wa',`أرسلت لك: ${text}`,1500);sys(`whatsapp.send → "${text}"`);}
const SC={
  async print(n){
    setPipe([['A1','A1'],['A1','PRINT MGR'],['FIN','FINANCE'],['MGR','MANAGER'],['A1','PRINTING'],['WA','WHATSAPP']]);
    stepPipe(0);sys(`a1.request part=#${n}`);stepPipe(1);setStatus('prt','busy');await say('prt',`طلب طباعة القطعة رقم ${n} من MakerWorld`);
    stepPipe(2);await visit('prt','fin');await say('prt','كم تكلفة الفلامنت؟');await say('fin','١٤ غرام PLA، تقريباً ٠٫٤ ريال. موافق ✓');HOME.spent+=1;updateTV('finance');
    stepPipe(3);await visit('prt','ceo');await say('ceo','اعتمدت. ابدأ وبلّغ أبو خالد إذا خلصت');
    stepPipe(4);await go('prt',2,-2.4,-.75);await face(AGENTS.prt,Math.PI);await say('prt','بدأت الطباعة على A1',900);AGENTS.prt.mode='stand';
    await runPrint(n);HOME.prints++;updateTV('daily');await say('prt',`خلصت القطعة ${n} ✓`,1000);
    stepPipe(5);await go('prt',0,-3.6,-.2);await face(AGENTS.prt,Math.PI);setStatus('wa','busy');await whatsapp(`القطعة ${n} جاهزة على الطابعة`);setStatus('wa','done');
    AGENTS.prt.last=`طبعت القطعة رقم ${n}.`;await goHome('prt');printer.state='idle';idlePipe();
  },
  async stuck(){
    setPipe([['CAM','A1 CAMERA'],['A1','PRINT MGR'],['MGR','MANAGER'],['WA','WHATSAPP']]);
    printer.state='stuck';updatePrinterCard();stepPipe(0);sys('a1.camera → spaghetti detected · pause');
    stepPipe(1);setStatus('prt','err');await say('prt','الكاميرا شافت الطباعة خربت! وقفتها');
    stepPipe(2);await visit('prt','ceo');setStatus('prt','err');await say('ceo','بلّغ أبو خالد فوراً');
    stepPipe(3);await go('prt',0,-3.6,-.2);setStatus('prt','err');await face(AGENTS.prt,Math.PI);await whatsapp('الطابعة علقت ووقفتها مؤقتاً ⚠️');setStatus('wa','err');
    AGENTS.prt.last='الطابعة علقت ووقفتها وبلغتك.';await goHome('prt','err');idlePipe();
  },
  async bill(name,amount){
    setPipe([['MAIL','EMAILS'],['FIN','FINANCE'],['MGR','MANAGER'],['WA','WHATSAPP']]);
    stepPipe(0);HOME.inbox++;updateTV('mail');setStatus('mail','busy');await say('mail',`وصلت فاتورة ${name}: ${amount} ريال`);
    stepPipe(1);await visit('mail','fin');await say('fin',`سجلتها. باقي من ميزانية الشهر ${(HOME.budget-HOME.spent-amount).toLocaleString('en')} ريال`);HOME.spent+=amount;HOME.bills.push([name,amount]);updateTV('finance');setStatus('fin','done');
    stepPipe(2);await visit('mail','ceo');await say('ceo','ادفعها قبل الموعد وذكّر أبو خالد');
    stepPipe(3);await goHome('mail');HOME.inbox=Math.max(0,HOME.inbox-1);updateTV('mail');setStatus('wa','busy');await whatsapp(`تذكير: فاتورة ${name} ${amount} ريال`);setStatus('wa','done');
    AGENTS.mail.last=`فرزت فاتورة ${name}.`;AGENTS.fin.last=`سجلت فاتورة ${name} ${amount} ريال.`;idlePipe();
  },
  async maintenance(item){
    setPipe([['HOME','HOME'],['CAL','BOOKING'],['FIN','FINANCE'],['WA','WHATSAPP']]);
    stepPipe(0);setStatus('home','busy');await say('home',`${item} يحتاج صيانة. أدور أقرب موعد`);
    stepPipe(1);await sleep(800);HOME.tasks.unshift(`صيانة ${item} الخميس ٤ العصر`);updateTV('home');await say('home','حجزت الخميس الساعة ٤ العصر');
    stepPipe(2);await visit('home','fin');await say('fin','التكلفة المتوقعة ٢٥٠ ريال. ضمن الميزانية ✓');HOME.spent+=250;updateTV('finance');setStatus('fin','idle');
    stepPipe(3);await goHome('home');setStatus('wa','busy');await whatsapp(`موعد صيانة ${item}: الخميس ٤ العصر`);setStatus('wa','done');
    AGENTS.home.last=`حجزت صيانة ${item}.`;idlePipe();
  },
  async trip(place){
    setPipe([['FAM','FAMILY'],['FIN','FINANCE'],['MGR','MANAGER'],['WA','WHATSAPP']]);
    stepPipe(0);HOME.trip=place;updateTV('family');setStatus('fam','busy');await say('fam',`جهزت خطة رحلة ${place}: يومين، فندق عائلي، أنشطة للعيال`);
    stepPipe(1);await visit('fam','fin');await say('fin','الميزانية المقترحة ٢٬٤٠٠ ريال. تمشي ✓');
    stepPipe(2);await visit('fam','ceo');await say('ceo','حلو، أرسلها لأبو خالد للاعتماد');
    stepPipe(3);await goHome('fam');setStatus('wa','busy');await whatsapp(`خطة رحلة ${place} جاهزة للاعتماد`);setStatus('wa','done');
    AGENTS.fam.last=`جهزت خطة رحلة ${place}.`;idlePipe();
  },
  async design(item){
    setPipe([['DES','DESIGN'],['A1','PRINT MGR'],['MGR','MANAGER']]);
    stepPipe(0);setStatus('des','busy');await say('des',`أدور تصميم ${item} على MakerWorld…`);await sleep(900);HOME.designs++;updateTV('design');await say('des','لقيت تصميم ممتاز وجهزت ملف الطباعة');
    stepPipe(1);await visit('des','prt');await say('prt','استلمت الملف. ٢ ساعة و١٤ غرام');
    stepPipe(2);await visit('des','ceo');await say('ceo','تمام، انتظر أمر الطباعة من أبو خالد');
    await goHome('des');AGENTS.des.last=`جهزت ملف ${item}.`;idlePipe();
  },
  async report(){
    setPipe([['MGR','MANAGER'],['FIN','FINANCE'],['MAIL','EMAILS'],['A1','PRINTS'],['WA','WHATSAPP']]);
    stepPipe(0);setStatus('ceo','busy');await say('ceo','اجتماع التحديث اليومي، الكل للطاولة');
    const seats=[['fin',2.2,-.9,Math.PI/2],['mail',4.6,-.9,-Math.PI/2],['prt',3.4,.35,Math.PI],['home',2.4,.05,Math.PI*.75],['fam',4.4,.05,-Math.PI*.75]];
    await Promise.all(seats.map(([id,x,z,r])=>go(id,4,x,z).then(()=>face(AGENTS[id],r))));
    await go('ceo',4,3.4,-2.1);await face(AGENTS.ceo,0);
    stepPipe(1);await say('fin',`المصروف ${HOME.spent.toLocaleString('en')} من ${HOME.budget.toLocaleString('en')} ريال`,1300);
    stepPipe(2);await say('mail',`${HOME.inbox} إيميلات تحتاج رد`,1100);
    stepPipe(3);await say('prt',`${HOME.prints} طباعات اليوم`,1100);
    stepPipe(4);await go('ceo',0,-3.6,-.2);await face(AGENTS.ceo,Math.PI);setStatus('wa','busy');await whatsapp('التحديث اليومي: كل شيء تمام ✓');setStatus('wa','done');
    await Promise.all(['fin','mail','prt','home','fam','ceo'].map(id=>goHome(id,'idle')));idlePipe();
  },
};

/* ---------------- command router ---------------- */
let queue=Promise.resolve(),pending=0;
function enqueue(fn){pending++;queue=queue.then(fn).catch(e=>{console.error(e);sys('error: '+e.message);}).finally(()=>pending--);}
const norm=s=>s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function ask(text){
  feed('',text,'me');const t=norm(text);
  const who=Object.values(AGENTS).sort((a,b)=>Math.max(...b.keys.map(k=>k.length))-Math.max(...a.keys.map(k=>k.length))).find(a=>a.keys.some(k=>t.includes(norm(k))));
  if(who&&/(شنو|وش|ايش|شو|كيف) ?(صار|الوضع|سويت|عندك|اخبار)/.test(t)){
    enqueue(async()=>{await say(who.id,`${who.last} (حالتي: ${STATUS[who.status][0]})`,2200);});return;}
  const num=+(t.match(/\d+/)||[0])[0];
  let job=null;
  if(/علق|عطل|خرب|سباقيتي/.test(t))job=()=>SC.stuck();
  else if(/فاتور|كهرب|انترنت|سداد/.test(t)){const nm=/انترنت/.test(t)?'الإنترنت':/موي|مياه/.test(t)?'المياه':'الكهرباء';job=()=>SC.bill(nm,num||420);}
  else if(/صمم|تصميم|stl|ستل/.test(t)){const it=(text.replace(/.*(صمم لي|تصميم)\s*/,'')||'قطعة').slice(0,24);job=()=>SC.design(it);}
  else if(/اطبع|طباعه|طبع/.test(t))job=()=>SC.print(num||Math.floor(Math.random()*30)+1);
  else if(/صيانه|مكيف|سباك|كهربائي|تصليح/.test(t)){const it=/مكيف/.test(t)?'المكيف':/سباك|موي/.test(t)?'السباكة':'البيت';job=()=>SC.maintenance(it);}
  else if(/رحله|سفر|سافر|عطله/.test(t)){const m=text.match(/رحلة\s+(\S+)/)||text.match(/الى\s+(\S+)/)||text.match(/إلى\s+(\S+)/);job=()=>SC.trip(m?m[1]:'العلا');}
  else if(/تقرير|ابديت|أبديت|ملخص|تحديث/.test(t))job=()=>SC.report();
  else if(/ناموا|نوم|ارتاحوا/.test(t))job=async()=>{Object.keys(AGENTS).forEach(id=>{if(id!=='ceo')setStatus(id,'sleep');});await say('ceo','الكل نام. أصحيهم أول ما يجي شغل');};
  if(!job){enqueue(()=>say('ceo','جرّب: اطبع لي رقم 21 · وصلت فاتورة الكهرباء 420 · المكيف يحتاج صيانة · خطط رحلة العلا · صمم لي حامل جوال · أبديت',2600));return;}
  if(pending)feed('المدير العام',`تمام، حطيته في الطابور (${pending} قبله).`);else feed('المدير العام','تمام، أوزعه الحين.');
  enqueue(job);
}
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('q').value.trim();if(v){ask(v);$('q').value='';}});
const QUICK=[['اطبع قطعة','اطبع لي القطعة رقم 21'],['فاتورة الكهرباء','وصلت فاتورة الكهرباء 420'],['صيانة المكيف','المكيف يحتاج صيانة'],['رحلة العلا','خطط لنا رحلة العلا'],['تصميم','صمم لي حامل جوال'],['الطابعة علقت','الطابعة علقت'],['@المالي وش صار؟','المدير المالي وش صار؟']];
$('quick').innerHTML=QUICK.map(([l,q])=>`<button class="chipq" data-q="${q}">${l}</button>`).join('');
$('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
$('updBtn').onclick=()=>ask('أبديت');

/* public event API */
window.tower={emit(e){const m={print:()=>SC.print(e.part||1),stuck:()=>SC.stuck(),bill:()=>SC.bill(e.name||'فاتورة',e.amount||0),maintenance:()=>SC.maintenance(e.item||'البيت'),trip:()=>SC.trip(e.place||'رحلة'),design:()=>SC.design(e.item||'قطعة'),report:()=>SC.report()}[e.type];if(m){sys(`event ${e.type}`);enqueue(m);}},agents:AGENTS,home:HOME};

/* ---------------- day / night ---------------- */
let day=false;
function applyDay(){
  $('dayBtn').textContent=day?'☀ نهاري':'☾ ليلي';$('dayBtn').setAttribute('aria-pressed',String(day));
  hemi.intensity=day?.95:.32;moon.intensity=day?.9:.25;moon.color.set(day?'#fff6e6':'#9fb2ff');
  scene.background.copy(day?DAY_BG:NIGHT_BG);scene.fog.color.copy(scene.background);
  roomLights.forEach(l=>l.intensity=day?.55:1.25);lampGlows.forEach(g=>g.visible=!day||g.type==='Sprite');
  windows.forEach(w=>w.material.map=day?winDay:winNight);
  if(bloom)bloom.strength=day?.35:.75;renderer.toneMappingExposure=day?1.1:1.05;
}
$('dayBtn').onclick=()=>{day=!day;applyDay();};

/* ---------------- picking printer ---------------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mp,camera);
  if(ray.intersectObject(printer.g,true).length)openPrinter();});

/* ---------------- resize / loop ---------------- */
const TARGET=new THREE.Vector3(.8,8.4,0);
function frame(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);if(composer){composer.setSize(w,h);}
  camera.aspect=w/h;
  const top=document.querySelector('.top').getBoundingClientRect().bottom, bot=h-document.querySelector('.feed').getBoundingClientRect().top+10;
  const free=Math.max(h*.35,h-top-bot);camera.setViewOffset(w,h,0,(bot-top)/2,w,h);camera.updateProjectionMatrix();
  const vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));const needH=(19.5)/2/vf*(h/free), needW=(w<600?20.5:23)/2/(vf*camera.aspect);
  const dist=Math.max(needH,needW)*1.02+4;
  const dir=new THREE.Vector3(.38,.3,1).normalize();
  controls.target.copy(TARGET);camera.position.copy(TARGET).addScaledVector(dir,dist);controls.minDistance=dist*.35;controls.maxDistance=dist*1.3;controls.update();
}
addEventListener('resize',frame);frame();
const clock=new THREE.Clock(),v3=new THREE.Vector3();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.sec);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.r();}}
  for(const a of Object.values(AGENTS))animateAgent(a,dt,t);
  printerTick(t);holo.rotation.y+=dt*.8;holo.rotation.x+=dt*.3;globe.rotation.y+=dt*.3;
  controls.update();
  composer?composer.render():renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const a of Object.values(AGENTS)){
    v3.copy(a.g.position);v3.y+=a.mode==='sit'||a.mode==='type'||a.mode==='sleep'?2.0:2.3;v3.project(camera);
    a.el.hidden=v3.z>1;a.el.style.transform=`translate(${(v3.x+1)/2*w}px,${(1-v3.y)/2*h}px) translate(-50%,-100%)`;
  }
  requestAnimationFrame(loop);
}
applyDay();renderCounts();
feed('المدير العام','هلا أبو خالد 👋 الفريق في البيت جاهز. اكتب لي أي أمر، أو اضغط على أي وكيل أو على الطابعة.');
document.fonts&&document.fonts.ready.then(()=>{signTexes.forEach(redraw);Object.values(tvs).forEach(redraw);});
loop();
</script>
