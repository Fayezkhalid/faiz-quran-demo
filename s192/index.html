<title>شهادات S192 الصحية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a deep-green "permit" hero carrying the Hijri date and a compliance donut, a Hijri-month expiry strip, then employee cards ordered by urgency. Gold is reserved for the one primary action. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#0E1F1C; --muted:#64746F; --line:#E2E9E5;
  --hero-a:#07302A; --hero-b:#0F5A4C; --on-hero:#F1F7F4; --on-hero-dim:#A9C9C0; --gold:#E3B23C; --bar:#0F5A4C; --on-gold:#2A1E00;
  --bad:#C0352B; --bad-bg:#FBE5E2; --warn:#C96A00; --warn-bg:#FFE9CC; --soon:#A88A00; --soon-bg:#FAF1C2; --ok:#1C8A57; --ok-bg:#DDF3E7; --none:#7A8A96; --none-bg:#E6ECF0;
  --shadow:0 1px 2px rgba(14,31,28,.05),0 8px 24px rgba(14,31,28,.06);
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070F0D; --surface:#101C19; --ink:#E8F1EE; --muted:#8FA39D; --line:#1F302B;
  --hero-a:#0A2621; --hero-b:#11463B; --on-hero:#F1F7F4; --on-hero-dim:#9DBDB4; --gold:#E9BE55; --bar:#3BA98E; --on-gold:#2A1E00;
  --bad:#FF8E84; --bad-bg:#40130F; --warn:#FFB05C; --warn-bg:#3F2404; --soon:#E6CE5A; --soon-bg:#332C05; --ok:#5FD39A; --ok-bg:#0D3321; --none:#9FB0BC; --none-bg:#1E2A32;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070F0D; --surface:#101C19; --ink:#E8F1EE; --muted:#8FA39D; --line:#1F302B;
  --hero-a:#0A2621; --hero-b:#11463B; --on-hero:#F1F7F4; --on-hero-dim:#9DBDB4; --gold:#E9BE55; --bar:#3BA98E; --on-gold:#2A1E00;
  --bad:#FF8E84; --bad-bg:#40130F; --warn:#FFB05C; --warn-bg:#3F2404; --soon:#E6CE5A; --soon-bg:#332C05; --ok:#5FD39A; --ok-bg:#0D3321; --none:#9FB0BC; --none-bg:#1E2A32;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
.wrap{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.bad{--c:var(--bad);--b:var(--bad-bg)}.warn{--c:var(--warn);--b:var(--warn-bg)}.soon{--c:var(--soon);--b:var(--soon-bg)}.ok{--c:var(--ok);--b:var(--ok-bg)}.none{--c:var(--none);--b:var(--none-bg)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--on-hero);background:linear-gradient(150deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.hero::before{content:"";position:absolute;inset:0;opacity:.09;background-image:linear-gradient(45deg,var(--on-hero) 1px,transparent 1px),linear-gradient(-45deg,var(--on-hero) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to left,transparent 30%,#000);-webkit-mask-image:linear-gradient(to left,transparent 30%,#000);pointer-events:none}
.hero>*{position:relative}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{display:inline-flex;background:#FFFFFF;border-radius:14px;padding:9px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo img{display:block;height:44px;width:auto}
.brand{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--on-hero-dim)}
.badge{font-family:var(--display);font-weight:800;font-size:12px;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:3px 11px}
.hdate{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.gdate{color:var(--on-hero-dim);font-size:13.5px}
.hmain{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{flex:none;width:118px;height:118px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.donut .mid b{font-family:var(--display);font-weight:800;font-size:27px;font-variant-numeric:tabular-nums}
.donut .mid span{font-size:11.5px;color:var(--on-hero-dim)}
.legend{flex:1;min-width:170px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{border:1px solid transparent;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 10px;text-align:right;color:var(--on-hero);display:flex;flex-direction:column;gap:1px;min-width:0}
.lg[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,255,255,.14)}
.lg b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
.lg b i{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.lg span{font-size:11.5px;white-space:nowrap;color:var(--on-hero-dim)}
.hnote{font-size:13px;color:var(--on-hero-dim);border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
/* sections */
.sec h2{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--surface);border-radius:20px;padding:14px 10px 10px;box-shadow:var(--shadow)}
.mo{border:0;background:transparent;border-radius:12px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.mo[aria-pressed="true"]{background:var(--bg)}
.mo .n{font-family:var(--display);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.mo .bar{width:100%;max-width:30px;height:64px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.mo[aria-pressed="true"] .bar{background:var(--line)}
.mo .bar i{display:block;width:100%;background:var(--bar);border-radius:8px}
.mo.now .bar i{background:var(--warn)}
.mo .l{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.tools{display:flex;flex-direction:column;gap:10px}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:right;width:100%}
.av{grid-row:1/4;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--c);background:var(--b)}
.row .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.row .sub{grid-column:2;font-size:12.5px;color:var(--muted)}
.meter{grid-column:2;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--c)}
.days{grid-row:1/4;grid-column:3;text-align:center;min-width:54px;color:var(--c)}
.days b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.days span{font-size:11.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:500;border-radius:6px;padding:0 6px;margin-inline-start:6px;color:var(--c);background:var(--b)}
.chip{border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--c);background:var(--b)}
.dp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid transparent;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:right;width:100%}
.dp[aria-pressed="true"]{border-color:var(--gold)}
.dp .nm{font-weight:600}.dp .sub{font-size:12.5px;color:var(--muted)}
.pips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}
.pips i{height:6px;border-radius:6px;background:var(--line)}.pips i.on{background:var(--ok)}.pips i.cur{background:var(--gold)}
a.btn{text-decoration:none;text-align:center;color:inherit}
.link{border:0;background:transparent;color:var(--bar);font-family:var(--body);font-weight:600;font-size:13.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;gap:8px;align-items:center}
.drow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.drow .btn{flex:none;padding:10px 14px}
.drow.gone input{text-decoration:line-through;opacity:.5}
.lbl{font-size:13px;color:var(--muted)}
.preview{flex:none;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:190px;overflow:auto;text-align:start}
.empty{padding:30px 18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:18px}
.conv{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.dock{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;justify-content:center;z-index:3}
.dock>div{display:flex;gap:8px;width:100%;max-width:528px;background:var(--surface);border-radius:20px;padding:7px;box-shadow:var(--shadow)}
.btn{border:0;background:var(--bg);border-radius:14px;padding:12px 14px;font-weight:600;flex:1}
.btn.primary{background:var(--gold);color:var(--on-gold);font-family:var(--display)}
.btn.danger{color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.hint{font-size:12.5px;color:var(--muted);min-height:1.2em}
.hint.err{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;text-align:center;z-index:9}
textarea.copy{width:100%;min-height:140px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px)}}.donut circle{transition:stroke-dasharray .5s ease}.mo .bar i{transition:height .4s ease}}
</style>
