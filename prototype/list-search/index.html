<title>قائمة المقاضي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column, list editor on top, per-item product rows below. Utility tool, own palette (ink green + saffron). */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#1b2a24; --muted:#66756e; --line:#dde2dc;
  --accent:#1f6b52; --accent-fg:#ffffff; --saffron:#d98e04; --sale:#b3361b; --chip:#e9eee8;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a16; --surface:#1b2621; --fg:#e8efe9; --muted:#97a69d; --line:#2d3b34;
  --accent:#4fc79d; --accent-fg:#0b1a13; --saffron:#f0b43a; --sale:#ff8a6b; --chip:#25332c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --surface:#1b2621; --fg:#e8efe9; --muted:#97a69d; --line:#2d3b34;
  --accent:#4fc79d; --accent-fg:#0b1a13; --saffron:#f0b43a; --sale:#ff8a6b; --chip:#25332c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
label.t{font-weight:600}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:150px;resize:vertical;width:100%;box-sizing:border-box;line-height:1.9}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:11px 18px;flex:1}
button.primary:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-size:13px;padding:5px 10px;border-radius:99px}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:600}
.item{display:flex;flex-direction:column;gap:8px;min-width:0}
.item header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item h3{margin:0;font-size:18px}
.item h3 small{color:var(--muted);font-weight:400;font-size:13px;margin-inline-start:6px}
.link{background:none;border:0;color:var(--accent);padding:2px 0;font-weight:600}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.rail.all{flex-wrap:wrap;overflow:visible}
.card{flex:0 0 132px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.rail.all .card{flex:1 1 132px;max-width:calc(50% - 5px)}
.thumb{height:72px;border-radius:8px;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--fg)}
.name{font-size:13px;line-height:1.4;min-height:2.8em;overflow-wrap:anywhere}
.price{display:flex;gap:6px;align-items:baseline;font-weight:700;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:400;font-size:12px}
.price .now.sale{color:var(--sale)}
.add{position:absolute;inset-inline-start:6px;top:54px;width:32px;height:32px;padding:0;border-radius:50%;background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.out{opacity:.55}
.out .add{display:none}
.tag{font-size:11px;color:var(--muted)}
.miss{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
</style>
<main>
  <header>
    <h1>قائمة المقاضي</h1>
    <p class="sub">اكتب كل غرض في سطر، ويطلع لك صف منتجات لكل غرض. تجربة أولية ببيانات عيّنة من عندنا.</p>
  </header>

  <section class="panel" id="inputPanel">
    <label class="t" for="list">قائمتك</label>
    <textarea id="list" placeholder="بطاطس&#10;كتشب&#10;لبن&#10;سكر&#10;ماء" aria-describedby="h"></textarea>
    <p class="hint" id="h">اضغط Enter لسطر جديد. تقدر تكتب الكمية: «٢ حليب» أو «3 بيض». الأخطاء الإملائية البسيطة مقبولة.</p>
    <div class="row">
      <button class="primary" id="go" disabled>عرض النتائج</button>
      <button id="demo" type="button">جرّب قائمة جاهزة</button>
    </div>
    <div id="recentWrap" hidden>
      <div class="row" style="justify-content:space-between"><h2>عمليات البحث الأخيرة</h2><button class="link" id="clearRecent" type="button">حذف الكل</button></div>
      <div class="chips" id="recent"></div>
    </div>
  </section>

  <section id="results" aria-live="polite"></section>
  <p class="note">البيانات والأسعار والصور هنا عيّنة وهمية لتجربة البحث فقط.</p>
</main>

<script id="core">
/* ---- search core: pure functions, no DOM ---- */
(function(root){
  const AR_DIG="٠١٢٣٤٥٦٧٨٩";
  function norm(s){
    return String(s||"").toLowerCase()
      .replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d))
      .replace(/[ً-ٰٟـ]/g,"")
      .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
      .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  }
  function stem(w){
    if(w.length>4&&w.startsWith("ال"))w=w.slice(2);
    if(w.length>4&&/(ات|ون|ين)$/.test(w))w=w.slice(0,-2);
    if(w.length>3&&w.endsWith("ه"))w=w.slice(0,-1);
    return w;
  }
  const GROUPS=[
    "بطاطس بطاطا بطاطه potato potatoes","طماطم بندوره tomato tomatoes","رز ارز rice","سكر sugar","ماء مياه موية water",
    "خبز عيش bread","دجاج فروج chicken","بيض بيضه eggs egg","زبادي روب yogurt yoghurt","شاي tea","قهوه coffee",
    "كتشب كاتشب ketchup","حليب milk","جبن جبنه cheese","زيت oil","معكرونه مكرونه pasta","موز banana","تفاح apple",
    "خيار cucumber","بصل onion","صابون soap","شامبو shampoo","معجون toothpaste","حفاظات بامبرز diapers","مناديل tissues","عصير juice","بسكويت biscuit biscuits","شيبس رقائق chips"
  ];
  const SYN=new Map();
  GROUPS.forEach(g=>{const ws=g.split(" ").map(w=>stem(norm(w)));ws.forEach(w=>{const a=SYN.get(w)||new Set();ws.forEach(x=>a.add(x));SYN.set(w,a)})});
  function lev(a,b,max){
    if(Math.abs(a.length-b.length)>max)return max+1;
    let p=Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){const c=[i];let m=c[0];
      for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));m=Math.min(m,c[j])}
      if(m>max)return max+1;p=c}
    return p[b.length];
  }
  function parseLine(line){
    let t=norm(line),qty=1;
    const m=t.match(/^(\d+)\s+(.+)$/)||t.match(/^(.+?)\s+(\d+)$/);
    if(m){const n=/^\d+$/.test(m[1])?m[1]:m[2];qty=Math.min(+n,99);t=(/^\d+$/.test(m[1])?m[2]:m[1])}
    return{raw:line.trim(),text:t,qty,tokens:t.split(" ").filter(Boolean).map(stem)};
  }
  function indexProduct(p){
    const toks=norm([p.ar,p.en,p.cat,(p.kw||[]).join(" ")].join(" ")).split(" ").filter(Boolean).map(stem);
    return Object.assign({},p,{_t:[...new Set(toks)],_name:stem(norm(p.ar).split(" ")[0])});
  }
  function tokScore(q,pt){
    const alts=SYN.get(q)||new Set([q]);let best=0;
    for(const a of alts){
      if(a===pt)best=Math.max(best,1);
      else if(a.length>=2&&pt.startsWith(a))best=Math.max(best,.85);
      else if(pt.length>=3&&a.startsWith(pt)&&a.length-pt.length<=2)best=Math.max(best,.6);
      else if(/[a-z]/.test(a)===/[a-z]/.test(pt)){
        const latin=/[a-z]/.test(a);
        const max=latin?(a.length>=7?1:0):(a.length>=7?2:a.length>=4?1:a.length===3&&a[0]===pt[0]?1:0);
        if(max&&lev(a,pt,max)<=max)best=Math.max(best,.6)}
    }
    return best;
  }
  function search(q,catalog,limit){
    if(!q.tokens.length)return[];
    const out=[];
    for(const p of catalog){
      let sum=0,ok=true;
      for(const qt of q.tokens){let b=0;for(const pt of p._t)b=Math.max(b,tokScore(qt,pt));if(b<.6){ok=false;break}sum+=b}
      if(!ok)continue;
      let s=sum/q.tokens.length;
      if(tokScore(q.tokens[0],p._name)>=.85)s+=.15;
      s+=(p.pop||0)*.05; if(p.stock===false)s-=.5;
      out.push({p,s});
    }
    out.sort((a,b)=>b.s-a.s);
    return out.slice(0,limit||60).map(x=>x.p);
  }
  root.Core={norm,stem,parseLine,indexProduct,search,lev};
  if(typeof module!=="undefined")module.exports=root.Core;
})(typeof window!=="undefined"?window:globalThis);
</script>

<script id="app">
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=n=>n.toLocaleString("ar-SA",{minimumFractionDigits:2,maximumFractionDigits:2});
let cart={};
function renderRecent(){
  const r=store.get("recent",[]);$("recentWrap").hidden=!r.length;$("recent").replaceChildren();
  r.forEach(l=>{const b=document.createElement("button");b.type="button";b.textContent=l.split("\n").slice(0,3).join("، ")+(l.split("\n").length>3?"…":"");
    b.onclick=()=>{$("list").value=l;sync();run()};$("recent").append(b)});
}
function sync(){$("go").disabled=!$("list").value.trim()}
function card(p,qty){
  const c=document.createElement("div");c.className="card"+(p.stock?"":" out");
  const th=document.createElement("div");th.className="thumb";th.style.background=p.color;th.textContent=p.ar.trim()[0];
  const nm=document.createElement("div");nm.className="name";nm.textContent=p.ar;
  const pr=document.createElement("div");pr.className="price";
  const now=document.createElement("span");now.className="now"+(p.old?" sale":"");now.textContent=fmt(p.price)+" ر.س";pr.append(now);
  if(p.old){const s=document.createElement("s");s.textContent=fmt(p.old);pr.append(s)}
  const add=document.createElement("button");add.className="add";add.type="button";add.textContent="+";add.setAttribute("aria-label","أضف "+p.ar);
  add.onclick=()=>{cart[p.id]=(cart[p.id]||0)+qty;bar()};
  c.append(th,nm,pr,add);
  if(!p.stock){const t=document.createElement("span");t.className="tag";t.textContent="غير متوفر";c.append(t)}
  return c;
}
function bar(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);$("bar").hidden=!n;
  const t=Object.entries(cart).reduce((a,[id,q])=>a+CATALOG[id].price*q,0);
  $("cnt").textContent=n+" منتج في السلة";$("tot").textContent=fmt(t)+" ر.س";
}
function run(){
  const lines=$("list").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const seen=new Set(),items=[];
  lines.forEach(l=>{const q=Core.parseLine(l);const k=q.tokens.join(" ");if(k&&!seen.has(k)){seen.add(k);items.push(q)}});
  const recent=[lines.join("\n"),...store.get("recent",[]).filter(x=>x!==lines.join("\n"))].slice(0,5);store.set("recent",recent);renderRecent();
  const box=$("results");box.replaceChildren();
  const h=document.createElement("h2");h.textContent="قائمتي";box.append(h);
  const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;gap:18px;margin-top:10px";box.append(wrap);
  items.forEach(q=>{
    const res=Core.search(q,CATALOG,40);
    const it=document.createElement("div");it.className="item";
    const hd=document.createElement("header");const t=document.createElement("h3");t.textContent=q.raw;
    if(q.qty>1){const s=document.createElement("small");s.textContent="× "+q.qty;t.append(s)}hd.append(t);
    if(res.length){
      const rail=document.createElement("div");rail.className="rail";res.forEach(p=>rail.append(card(p,q.qty)));
      if(res.length>2){const l=document.createElement("button");l.className="link";l.type="button";l.textContent="مشاهدة الكل ("+res.length+")";
        l.onclick=()=>{const all=rail.classList.toggle("all");l.textContent=all?"إخفاء":"مشاهدة الكل ("+res.length+")"};hd.append(l)}
      it.append(hd,rail);
    }else{
      const m=document.createElement("div");m.className="miss";m.textContent="ما لقيت «"+q.raw+"». جرّب كلمة ثانية أو اسم أبسط.";it.append(hd,m);
    }
    wrap.append(it);
  });
  const ed=document.createElement("button");ed.type="button";ed.textContent="تعديل القائمة";ed.onclick=()=>{$("list").focus();window.scrollTo({top:0,behavior:"smooth"})};box.append(ed);
  box.scrollIntoView({behavior:"smooth",block:"start"});
}
$("list").addEventListener("input",sync);
$("go").onclick=run;
$("demo").onclick=()=>{$("list").value="بطاطس\nكتشب\nلبن\n٢ سكر\nماء\nبيظ\nحليب\nجبنه\nموز\nطماطم";sync();run()};
$("clearRecent").onclick=()=>{store.set("recent",[]);renderRecent()};
renderRecent();sync();
</script>
