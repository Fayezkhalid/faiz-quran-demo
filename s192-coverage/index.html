<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#040605">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>تغطية السعوديين S192</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Design: dark charcoal product-page look. Centered caps section titles, hairline teal-outlined pill buttons, vertical dot timeline, spec columns. Single dark theme by design. */
:root{
  --bg:#040605;--surface:#0D1410;--soft:#09100C;--ink:#EEF7F2;--muted:#86A092;--line:#1C2A23;
  --acc:#34F5A0;--acc-bg:rgba(52,245,160,.08);
  --bad:#FF6F61;--bad-bg:rgba(255,111,97,.13);--warn:#F5B83D;--warn-bg:rgba(245,184,61,.13);--ok:#7BE38B;--ok-bg:rgba(123,227,139,.12);--none:#8C969C;--none-bg:rgba(255,255,255,.06);--blue:#4DA3FF;--blue-bg:rgba(77,163,255,.13);
  --display:"El Messiri","Cairo",system-ui,sans-serif;--num:"Montserrat","Cairo",system-ui,sans-serif;--body:"Montserrat","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background-color:var(--bg);position:relative;color:var(--ink);font:15px/1.55 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* animated neon-green space backdrop: slow, low-contrast */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 120%,rgba(0,60,35,.35),transparent 60%)}
.bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
.bg i:nth-child(1){left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(40,255,150,.17),transparent 62%);animation:drift1 34s ease-in-out infinite alternate}
.bg i:nth-child(2){right:-35vmax;top:20vh;background:radial-gradient(circle,rgba(0,200,120,.13),transparent 62%);animation:drift2 44s ease-in-out infinite alternate}
.bg i:nth-child(3){left:10vmax;bottom:-45vmax;background:radial-gradient(circle,rgba(90,255,200,.10),transparent 62%);animation:drift3 52s ease-in-out infinite alternate}
.bg::before{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,#d9fff0,transparent),radial-gradient(1px 1px at 38% 64%,#baffdf,transparent),radial-gradient(1.5px 1.5px at 72% 22%,#fff,transparent),radial-gradient(1px 1px at 86% 78%,#c8ffe6,transparent),radial-gradient(1px 1px at 55% 40%,#fff,transparent),radial-gradient(1px 1px at 24% 88%,#d9fff0,transparent);background-size:340px 340px;animation:twinkle 9s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-20vmax,-10vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(14vmax,-16vmax) scale(1.1)}}
@keyframes twinkle{from{opacity:.3}to{opacity:.65}}
@media (prefers-reduced-motion:reduce){.bg i,.bg::before{animation:none}}
/* hero */
.hero{background:linear-gradient(180deg,rgba(6,12,9,.55),rgba(4,6,5,.15));border-bottom:1px solid var(--line);padding:16px 0 26px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mark{font:800 15px var(--num);letter-spacing:.14em;direction:ltr}
.hero h1{font:700 42px/1.15 var(--display);margin:22px 0 0;text-shadow:0 0 28px rgba(52,245,160,.22)}
.lead{margin:10px 0 18px;color:var(--muted);font-size:13px;max-width:30ch}
.herogrid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.glow{position:relative;width:132px;height:132px;display:grid;place-items:center;text-align:center}
.glow i{position:absolute;border-radius:50%}
.glow{color:var(--acc)}.glow.st-bad{color:var(--bad)}.glow.st-warn{color:var(--warn)}.glow.st-ok{color:var(--ok)}
.glow i:nth-child(1){inset:0;border:1px solid currentColor;box-shadow:0 0 46px -10px currentColor}
.glow i:nth-child(2){inset:14px;border:1px solid rgba(255,255,255,.16)}
.glow i:nth-child(3){inset:30px;background:radial-gradient(circle,color-mix(in srgb,currentColor 30%,transparent),transparent 72%)}
.glow b{position:relative;font:800 34px/1 var(--num)} .glow small{position:relative;display:block;font-size:11px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand{cursor:pointer}.hero.compact .mt{display:none}.hero.compact .logo img{max-height:26px}
.logo img{display:block;max-height:44px;max-width:180px;filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 9px rgba(255,255,255,.45))}
.wm{display:flex;flex-direction:column;line-height:1.1}
.wm b{font:800 17px var(--num);letter-spacing:.22em;color:#eafff4;text-shadow:0 0 8px rgba(52,245,160,.9),0 0 22px rgba(52,245,160,.5)}
.wm small{font-size:11px;color:var(--acc);letter-spacing:.04em;text-shadow:0 0 10px rgba(52,245,160,.6)}
.clock{text-align:center;margin-top:16px}
.ct{display:inline-flex;align-items:baseline;gap:8px;direction:ltr;font:700 46px/1 var(--num);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:#eafff4;text-shadow:0 0 12px rgba(52,245,160,.75),0 0 34px rgba(52,245,160,.35)}
.ct .cs{font-size:20px;opacity:.75;width:1.4em;text-align:left} .ct .ca{font:600 18px var(--display);color:var(--acc)}
.cd{margin-top:8px;font-size:13px;color:var(--ink)} .ch{font-size:12px;color:var(--muted);margin-top:2px}
.hero.compact .clock,.hero.compact .mark{display:none}
.hero.compact{padding:12px 0}.hero.compact .herogrid{display:none}.hero .mt{display:none;font:700 13px var(--display);margin-inline-start:10px}.hero.compact #badge{display:none}.mark{white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--ink);background:rgba(255,255,255,.03)}
/* generic */
.card{background:linear-gradient(180deg,rgba(16,24,19,.84),rgba(9,14,11,.84));backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font:700 17px var(--display);letter-spacing:.02em;text-align:center;margin:0 0 12px}
.sec{font:700 18px var(--display);letter-spacing:.02em;text-align:center;margin:30px 0 10px;color:var(--ink)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.car{display:flex;align-items:center;gap:6px}
.arr{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:18px;line-height:1}
.day{display:flex;flex-direction:column;align-items:center;min-width:64px;line-height:1.25;padding:6px 10px;border-radius:16px}
.day b{font:800 17px var(--num)} .day span{font-size:12px}
.day .fire{font-size:11px;color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-none{background:var(--none-bg);color:var(--none)} .s-blue{background:var(--blue-bg);color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
select,input[type=text],input[type=search],input[type=number]{width:100%;min-height:44px;border:1px solid #243a2f;border-radius:12px;background:rgba(6,10,8,.8);padding:6px 12px}
select option{background:#0D1410}
.btn{min-height:44px;border-radius:999px;padding:8px 18px;font-weight:600;border:1px solid #2c4739;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:rgba(255,255,255,.04)}
.btn.pri{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.btn.pri:hover{background:rgba(52,245,160,.16)}
.btn.dan{border-color:rgba(255,111,97,.45);color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:4px 14px;font-size:13px}
.btn:disabled{opacity:.5}
/* result hero */
.res{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{width:112px;height:112px;border-radius:50%;border:2px solid currentColor;background:transparent!important;box-shadow:0 0 40px -10px currentColor,inset 0 0 26px -16px currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 46px/1 var(--num)}
.big small{font:500 11px var(--body);margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{border-radius:14px;padding:8px 4px;text-align:center;min-height:64px;border:1px solid var(--line)}
.tile b{display:block;font:800 22px/1.1 var(--num)} .tile span{font-size:11.5px}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
/* chart */
.chart{display:flex;align-items:flex-end;gap:2px;height:132px;padding-top:6px;direction:ltr}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;border-radius:6px;position:relative}
.col.in{background:rgba(255,255,255,.05);outline:1px solid var(--line)}
.col .n{font-size:10px;font-weight:600;color:var(--muted);height:14px}
.col .bar{width:100%;max-width:18px;border-radius:4px 4px 0 0;min-height:3px}
.col .h{font-size:9.5px;color:var(--muted);height:14px;margin-top:2px}
.b-bad{background:var(--bad)} .b-warn{background:#E8A21A} .b-ok{background:var(--ok)} .b-none{background:var(--none);opacity:.55}
/* people */
.emp{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.emp:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;border:1px solid rgba(52,245,160,.45);background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font:700 17px var(--display)}
.emp .nm{font-weight:600;line-height:1.3;text-align:right;unicode-bidi:plaintext}
.emp .meta{font-size:12.5px;color:var(--muted)}
.emp.sup .av{border-color:rgba(77,163,255,.75);background:var(--blue-bg);color:var(--blue);box-shadow:0 0 14px rgba(77,163,255,.5)}
.sup-card{border-color:rgba(77,163,255,.45);box-shadow:0 0 0 1px rgba(77,163,255,.18),0 0 26px -6px rgba(77,163,255,.45)}
.sup-card h2{color:var(--blue);text-shadow:0 0 14px rgba(77,163,255,.5)}
.supchip{display:inline-flex;white-space:nowrap;max-width:100%;align-items:center;gap:6px;margin-top:12px;padding:5px 14px;border-radius:999px;border:1px solid rgba(77,163,255,.6);background:var(--blue-bg);color:#cfe5ff;font-size:13px;box-shadow:0 0 18px -4px rgba(77,163,255,.7)}
.supchip i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dig summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0;color:var(--ink)}
.dig summary::-webkit-details-marker{display:none}
.acts{display:flex;gap:6px}
.ic{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid #343A3F;background:transparent;text-decoration:none;font-size:18px}
.ic.wa{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.wkgrid{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wk{flex:0 0 auto;white-space:nowrap;border-radius:10px;padding:4px 10px;background:var(--none-bg);color:var(--none);line-height:1.35;font-size:12.5px}
.wk b{font-weight:600;font-size:13px}
.wk.w{background:var(--ok-bg);color:var(--ok)} .wk.l{background:var(--warn-bg);color:var(--warn)} .wk.a{background:var(--bad-bg);color:var(--bad)}
details{margin-top:10px} summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--muted)}
/* heatmap */
.hmwrap{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:420px}
table.hm th{font-size:12px;font-weight:600;padding:4px 2px;position:sticky;top:0;background:#0B110E;z-index:1}
table.hm th.pk{color:var(--bad)}
table.hm td.hl{font-size:11px;color:var(--muted);text-align:center;width:54px;white-space:nowrap}
table.hm button.c{width:100%;min-height:30px;border-radius:7px;font-weight:700;font-size:13px}
.c.s-bad{background:var(--bad-bg);color:var(--bad)} .c.s-warn{background:var(--warn-bg);color:var(--warn)} .c.s-ok{background:var(--ok-bg);color:var(--ok)} .c.s-none{background:var(--none-bg);color:var(--none)}
/* vertical dot timeline */
.tline{position:relative;margin-top:12px;padding-inline-start:30px}
.tline::before{content:"";position:absolute;inset-block:6px;inset-inline-start:7px;width:1px;background:linear-gradient(var(--line),var(--acc) 50%,var(--line))}
.alert{position:relative;display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:6px 0 16px}
.alert::before{content:"";position:absolute;inset-inline-start:-30px;top:10px;width:15px;height:15px;border-radius:50%;border:2px solid var(--acc);background:var(--bg);box-shadow:0 0 0 4px rgba(52,245,160,.12)}
.alert b{font-weight:600}
/* spec columns */
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.spec h3{font:700 15px var(--display);letter-spacing:.02em;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.spec p{margin:0 0 6px;font-size:11.5px;color:var(--muted);line-height:1.5} .spec p b{display:block;color:var(--ink);font-weight:600}
/* verdict */
.verdict{border-radius:14px;padding:12px;margin-top:12px;font-weight:600}
.verdict small{display:block;font-weight:400;margin-top:2px}
.imp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.imp td,.imp th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
/* tabbar */
nav{position:fixed;inset-inline:0;bottom:0;background:rgba(4,7,5,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;min-height:52px;border-radius:12px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#E6FBF0;color:#06110B;padding:12px 16px;border-radius:999px;z-index:50;text-align:center}
.empty{text-align:center;padding:28px 12px}
.th{display:grid;grid-template-columns:1fr 64px 64px 64px 64px;gap:6px;align-items:center;margin-top:6px}
.th input{text-align:center;padding:4px;min-height:40px}
.th .hd{font-size:11.5px;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tile{transition:background .15s,border-color .15s}}
@media (max-width:380px){.hero h1{font-size:34px}.glow{width:108px;height:108px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="hero"><div class="wrap">
  <div class="topbar"><span class="brand" data-act="tab" data-t="home" role="link" aria-label="الرئيسية"><span class="logo" id="logoBox"></span><span class="mark">S192</span><span class="mt">تغطية السعوديين</span></span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center"><span class="badge" id="badge"></span><span class="badge" id="sync"></span></span></div>
  <div class="clock" role="timer" aria-label="الساعة والتاريخ"><div class="ct"><span id="clkT">--:--</span><span class="cs" id="clkS">00</span><span class="ca" id="clkA">م</span></div><div class="cd" id="clkD"></div><div class="ch" id="clkH"></div></div>
  <div class="herogrid"><div><h1>تغطية<br>السعوديين</h1><p class="lead" id="subtitle">—</p><button class="btn pri" data-act="homedetail">التفاصيل ←</button><div><span class="supchip" id="supChip"></span></div></div>
  <div class="glow" aria-hidden="true"><i></i><i></i><i></i><div><b id="ringN">0</b><small id="ringL">كاشير الآن</small></div></div></div>
</div></header>
<main class="wrap" id="app"></main>
<nav id="nav" aria-label="التنقل"></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fRoster" accept=".xls,.html,.htm" hidden>
<input type="file" id="fLogo" accept="image/*" hidden>

<script id="seed" type="application/json">null</script>
<script>
"use strict";
/* ===================== helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR_DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const GROUPS={all:"الكل",cashier:"كاشير",cs:"خدمة عملاء",produce:"خضار",other:"أخرى"};
const ROLE_AR={"CASHIER":"كاشير","CUSTOMER SERVICE MANAGER":"مدير خدمة عملاء","CUSTOMER SERVICE SUPERVISOR":"مشرف خدمة عملاء","CUSTOMER SERVICE ASSOCIATE":"موظف خدمة عملاء","FRESH FOOD ASSOCIATE (PRODUCE)":"موظف خضار","PRODUCE DEPT HEAD":"رئيس قسم الخضار","PRICE & INVENTORY CONTROLLER":"مراقب أسعار ومخزون","SECURITY GUARD":"حارس أمن","STORE ACCOUNTANT":"محاسب الفرع","ASSISTANT STORE MANAGER":"مساعد مدير الفرع"};
const REASONS=["غياب","إجازة","إجازة مرضية","استئذان","يوم وطني","أخرى"];
const RANK={none:0,ok:1,warn:2,bad:3};
const STLBL={bad:"🔴 خطر",warn:"🟡 تنبيه",ok:"🟢 كافٍ",none:"⚪ بدون تقييم"};
const KEY="s192cov.v1";
const DEFAULTS={store:"S192",peakDays:[5,6],nightEnd:7,weeks:4,leaveReturn:true,remDow:2,th:{all:{n:[4,6],p:[5,7]},cashier:{n:[2,3],p:[3,4]},cs:{n:[1,2],p:[2,3]},produce:{n:[1,1],p:[1,1]}}};

function hourLbl(h){h=((h%24)+24)%24;const p=h<12?"ص":"م";const x=h%12===0?12:h%12;return x+":00 "+p}
function minLbl(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;const p=h<12?"ص":"م";const x=h%12===0?12:h%12;return x+":"+String(mm).padStart(2,"0")+" "+p}
function endLbl(h){return h===24?"12:00 ص (منتصف الليل)":hourLbl(h)}
function pad(n){return String(n).padStart(2,"0")}
function disp(phone){const d=String(phone||"").replace(/\D/g,"");return d.startsWith("966")?"0"+d.slice(3):d}
function titleCase(n){return String(n||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bAl\b/g,"Al")}
function initials(n){const p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase()}
function groupOf(pos,dept){const p=String(pos||"").toUpperCase();if(p==="CASHIER")return"cashier";if(p.startsWith("CUSTOMER SERVICE"))return"cs";if(p.includes("PRODUCE")||/_PROD$/i.test(dept||""))return"produce";return"other"}
const AR_TOK={ABDULLAH:"عبدالله",ABDULRAHMAN:"عبدالرحمن",ABDULAZIZ:"عبدالعزيز",ABDULMAJEED:"عبدالمجيد",ABDULELAH:"عبدالإله",ABDULKARIM:"عبدالكريم",MOHAMMED:"محمد",MOHAMMAD:"محمد",MUHAMMAD:"محمد",AHMED:"أحمد",AHMAD:"أحمد",ALI:"علي",KHALID:"خالد",FAHAD:"فهد",FAISAL:"فيصل",FAYEZ:"فايز",SALEH:"صالح",SALEM:"سالم",SULTAN:"سلطان",NAWAF:"نواف",TURKI:"تركي",SAMI:"سامي",BANDER:"بندر",BANDAR:"بندر",FARES:"فارس",MANSOUR:"منصور",IBRAHIM:"إبراهيم",SAUD:"سعود",SAAD:"سعد",NASSER:"ناصر",YOUSEF:"يوسف",OMAR:"عمر",OTHMAN:"عثمان",HAMAD:"حمد",HUMOOD:"حمود",WALEED:"وليد",SUHAIL:"سهيل",RASHED:"راشد",MESHAL:"مشعل",MAJED:"ماجد",THAMER:"ثامر",HASSAN:"حسن",HUSSAIN:"حسين",SALMAN:"سلمان",TALAL:"طلال",NAIF:"نايف",ALHARBI:"الحربي",ALOTAIBI:"العتيبي",ALMUTAIRI:"المطيري",ALQAHTANI:"القحطاني",ALGHAMDI:"الغامدي",ALZAHRANI:"الزهراني",ALDOSARI:"الدوسري",ALSHEHRI:"الشهري",ALSUBAIE:"السبيعي",ALSHAMMARI:"الشمري",ALRASHIDI:"الرشيدي",ALOMRI:"العمري",ALMANSOUR:"المنصور",ALANAZI:"العنزي",ALYAMI:"اليامي",ALENEZI:"العنزي"};
function translit(n){

  for(let i=0;i<t.length;i++){let w=t[i];if(w==="AL"&&t[i+1]){w="AL"+t[++i]}const a=AR_TOK[w];if(!a)return null;o.push(a)}
  return o.length?o.join(" "):null;
}

/* ===================== schedule model ===================== */
const isoToday=()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`};
const addDays=(iso,k)=>{const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d+k)).toISOString().slice(0,10)};
const daysBetween=(a,b)=>{const f=x=>{const [y,m,d]=x.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((f(b)-f(a))/864e5)};
/* الروستر أسبوع ثابت يتكرر: النافذة تبدأ من اليوم (أو من أول يوم بالروستر إن كان لم يبدأ) */
let _dk="",_dv=[],_K=0;
function dates(){
  const base=S.roster.dates||[];if(!base.length)return[];
  const t=isoToday(),w=S.settings.weeks||4,key=base[0]+"|"+base.length+"|"+w+"|"+t;
  if(key!==_dk){_K=Math.max(0,daysBetween(base[0],t));_dv=Array.from({length:Math.max(base.length,7*w)},(_,i)=>addDays(base[0],_K+i));_dk=key}
  return _dv;
}
const offK=()=>{dates();return _K};
let _tr=null,_typ={};
function typical(id){
  if(_tr!==S.roster){_tr=S.roster;_typ={}}
  if(id in _typ)return _typ[id];
  const c={};for(const x of S.roster.rows[id].shifts)if(!parseShift(x).off)c[x]=(c[x]||0)+1;
  const b=Object.entries(c).sort((a,z)=>z[1]-a[1])[0];return(_typ[id]=b?b[0]:null);
}
function baseStr(id,di){
  const r=S.roster.rows[id],L=r.shifts.length,k=di+offK();let sh=r.shifts[((k%L)+L)%L];
  if((k>=L||k<0)&&S.settings.leaveReturn){const p=parseShift(sh);if(p.off&&p.type==="leave"){const t=typical(id);if(t)sh=t}}
  return sh;
}
const dowOf=di=>{const [y,m,d]=dates()[di].split("-").map(Number);return new Date(y,m-1,d).getDay()};
const dmy=di=>{const [y,m,d]=dates()[di].split("-");return d+"/"+m+"/"+y};
const isPeak=di=>S.settings.peakDays.includes(dowOf(di));
const staffIds=()=>Object.keys(S.staff).filter(id=>S.roster.rows[id]);
const grpOf=id=>S.staff[id]?S.staff[id].grp:"other";

function parseShift(str){
  const m=/From\s*(\d{1,2}):(\d{2})\s*To\s*(\d{1,2}):(\d{2})/i.exec(str||"");
  if(m){const s=+m[1]*60+ +m[2];let e=+m[3]*60+ +m[4];if(e<=s)e+=1440;return{s,e}}
  const t=String(str||"").trim();
  if(/^day\s*off$/i.test(t))return{off:true,type:"dayoff",label:"راحة"};
  if(/leave|vacation|lwop/i.test(t))return{off:true,type:"leave",label:/without/i.test(t)?"إجازة بدون راتب":"إجازة"};
  return{off:true,type:"leave",label:t||"—"};
}
function effShift(id,di,ov=S.overrides){
  const o=ov[id+"|"+(di>=0?dates()[di]:addDays(dates()[0],di))];
  if(o){return o.kind==="off"?{off:true,type:"absent",label:o.reason||"غياب",ovr:true}:{s:o.s,e:o.e,ovr:true}}
  return S.roster.rows[id]?parseShift(baseStr(id,di)):{off:true,type:"dayoff",label:"—"};
}
function present(id,di,h,ov){
  const t=h*60+30,c=effShift(id,di,ov);
  if(c.s!=null&&c.s<=t&&t<c.e)return true;
  {const p=effShift(id,di-1,ov);if(p.s!=null&&p.e>1440&&t+1440<p.e&&t+1440>=p.s)return true}
  return false;
}
const unknownPrev=()=>false; // الجدول أسبوع ثابت يتكرر، فاليوم السابق معروف دائمًا
function members(g){return staffIds().filter(id=>g==="all"||grpOf(id)===g)}
function countAt(g,di,h,ov){let n=0;for(const id of members(g))if(present(id,di,h,ov))n++;return n}
function statusOf(g,n,di,h){
  if(g==="other"||unknownPrev(di,h))return"none";
  if(h<S.settings.nightEnd)return(g==="all"||g==="cashier")?(n>=1?"ok":"bad"):"none";
  const [w,gd]=S.settings.th[g][isPeak(di)?"p":"n"];
  return n<w?"bad":n<gd?"warn":"ok";
}
const worst=a=>a.reduce((x,y)=>RANK[y]>RANK[x]?y:x,"none");
function analyze(g,di,from,to,ov){
  const counts=[],sts=[];
  for(let h=from;h<to;h++){const n=countAt(g,di,h,ov);counts.push(n);sts.push(statusOf(g,n,di,h))}
  const min=Math.min(...counts),max=Math.max(...counts),avg=counts.reduce((a,b)=>a+b,0)/counts.length;
  return{counts,sts,min,max,avg,st:worst(sts),minSt:statusOf(g,min,di,from+counts.indexOf(min))};
}
function runs(arr){ // contiguous ranges of truthy hours -> [[a,b)]
  const out=[];let a=null;
  arr.forEach((v,i)=>{if(v&&a==null)a=i;if(!v&&a!=null){out.push([a,i]);a=null}});
  if(a!=null)out.push([a,arr.length]);return out;
}

function waApp(){try{return localStorage.getItem(KEY+".wa")==="business"?"business":"regular"}catch(e){return"regular"}}
function waLink(d,text){
  const q=[d?"phone="+d:"",text?"text="+encodeURIComponent(text):""].filter(Boolean).join("&");
  if(waApp()==="business"){
    const ua=navigator.userAgent||"";
    if(/Android/i.test(ua))return`intent://send?${q}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end`;
    if(/iPhone|iPad|iPod/i.test(ua))return`whatsapp-business://send?${q}`;
  }
  return"https://wa.me/"+(d||"")+(text?"?text="+encodeURIComponent(text):"");
}
function contact(id){
  const p=S.staff[id]&&S.staff[id].phone;if(!p)return'<span class="muted small">لا يوجد جوال</span>';
  const d=String(p).replace(/\D/g,"");

}
function shiftTxt(c){return (c.off?c.label:minLbl(c.s)+" ← "+minLbl(c.e))+(c.prev?" · أمس":"")}
function dispShift(id,di,h){
  const c=effShift(id,di),t=h*60+30;
  if(c.s!=null&&c.s<=t&&t<c.e)return c;
  const p=effShift(id,di-1);
  return(p.s!=null&&p.e>1440&&t+1440<p.e&&t+1440>=p.s)?Object.assign({},p,{prev:true}):c;
}

function edInit(id,di){ui.ed={id:id||staffIds()[0]||null,dates:new Set([di??ui.di]),mode:"off",reason:"إجازة",s:13*60,e:22*60}}
function hypOverrides(){
  const ed=ui.ed,ov=Object.assign({},S.overrides);
  for(const i of ed.dates){const k=ed.id+"|"+dates()[i];ov[k]=ed.mode==="off"?{kind:"off",reason:ed.reason}:{kind:"shift",s:ed.s,e:ed.e}}
  return ov;
}
function impact(){
  const ed=ui.ed,hyp=hypOverrides(),gs=[...new Set(["all",grpOf(ed.id)].filter(x=>x!=="other"||true))].filter(g=>g!=="other");
  const rows=[];let level="ok";
  for(const di of [...ed.dates].sort((a,b)=>a-b)){
    for(const g of gs){
      const bad=[],hrs=[];
      for(let h=0;h<24;h++){
        const b=countAt(g,di,h),a=countAt(g,di,h,hyp);
        if(a===b)continue;
        const sb=statusOf(g,b,di,h),sa=statusOf(g,a,di,h);
        hrs.push({h,b,a,sb,sa,worse:RANK[sa]>RANK[sb]});
      }
      for(const [x,y] of runs(Array.from({length:24},(_,h)=>hrs.some(r=>r.h===h)))){
        const seg=hrs.filter(r=>r.h>=x&&r.h<y);
        const sa=worst(seg.map(r=>r.sa)),sb=worst(seg.map(r=>r.sb));
        const mnA=Math.min(...seg.map(r=>r.a)),mnB=Math.min(...seg.map(r=>r.b));
        const worse=seg.some(r=>r.worse);
        if(worse)level=RANK[sa]>RANK[level==="ok"?"ok":level]?sa:level;
        rows.push({di,g,x,y,mnB,mnA,sa,sb,worse});
      }
    }
  }
  // worst new status determines verdict
  level=rows.filter(r=>r.worse).reduce((l,r)=>RANK[r.sa]>RANK[l]?r.sa:l,"ok");
  return{rows,level};
}
function candidates(){
  const ed=ui.ed,g=grpOf(ed.id),out=[];
  for(const id of staffIds()){
    if(id===ed.id)continue;
    const ok=[...ed.dates].every(di=>{const c=effShift(id,di);return c.off&&c.type==="dayoff"});
    if(ok)out.push({id,same:grpOf(id)===g});
  }
  return out.sort((a,b)=>b.same-a.same);
}

  return `

    ${ed.mode==="off"?`<label class="f" for="edReason">السبب</label><select id="edReason" data-act="edreason">${REASONS.map(r=>`<option${r===ed.reason?" selected":""}>${r}</option>`).join("")}</select>`
    :`<div class="row2"><div><label class="f" for="edS">بداية الوردية</label><select id="edS" data-act="eds">${Array.from({length:24},(_,h)=>`<option value="${h*60}"${h*60===ed.s?" selected":""}>${hourLbl(h)}</option>`).join("")}</select></div>

    <div class="row2" style="margin-top:12px"><button class="btn pri" data-act="apply">تسجيل في الجدول</button><button class="btn" data-act="clear">إلغاء تعديل اليوم</button></div>
  </div>
  <div class="card"><h2>بدائل متاحة (في يوم راحتهم)</h2>${reps}</div>

/* ===================== import ===================== */
async function importRoster(file){
  const buf=await file.arrayBuffer();
  let txt;try{txt=new TextDecoder("windows-1256").decode(buf)}catch(e){txt=new TextDecoder().decode(buf)}
  const doc=new DOMParser().parseFromString(txt,"text/html");
  const rows=[...doc.querySelectorAll("tr")].map(tr=>[...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).map(c=>c.textContent.replace(/[\s ]+/g," ").trim()));
  const hdr=rows.find(r=>r.length>=4&&/^employee code$/i.test(r[0])&&/\d{1,2}\/\d{1,2}\/\d{4}/.test(r[2]||""));
  if(!hdr)throw new Error("لم أجد جدول الروستر في هذا الملف. تأكد أنه ملف Employees Rosters من النظام.");
  const ds=hdr.slice(2).map(h=>{const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(h);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:null});
  if(ds.some(d=>!d))throw new Error("تعذّر قراءة تواريخ الأعمدة.");
  const out={};
  for(const r of rows){
    if(r.length!==hdr.length||/^employee code$/i.test(r[0])||!/^\d+$/.test(r[0]))continue;
    out[r[0]]={name:r[1],shifts:r.slice(2)};
  }
  if(!Object.keys(out).length)throw new Error("الجدول فارغ.");
  S.roster={dates:ds,rows:out};S.rosterAt=Date.now();S.rosterUser=true;
  S.overrides=Object.fromEntries(Object.entries(S.overrides).filter(([k])=>k.split("|")[1]>ds[ds.length-1]));
  save();
  return Object.keys(out).length;
}

  else if(a==="upLogo")return $("#fLogo").click();
  else if(a==="rmLogo"){S.logo="";save();toast("أُزيل الشعار")}
  else if(a==="wipe"){if(confirm("مسح كل البيانات المحفوظة على هذا الجهاز؟")){try{localStorage.removeItem(KEY)}catch(x){}S=load();ui.ed=null;toast("تم المسح")}else return}
  render();
});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(RO&&MUT.has(a)){render();return toast("عرضك للقراءة فقط، ما تقدر تعدّل.")}
  if(a==="from"){ui.from=+t.value;clampRange("from")}
  else if(a==="to"){ui.to=+t.value;clampRange("to")}
  else if(a==="edemp"){ui.ed.id=t.value}
  else if(a==="edreason"){ui.ed.reason=t.value}
  else if(a==="eds"){ui.ed.s=+t.value}
  else if(a==="ede"){ui.ed.e=+t.value}
  else if(a==="th"){const v=Math.max(0,Math.min(50,+t.value||0));S.settings.th[t.dataset.g][t.dataset.k][+t.dataset.j]=v;save()}
  else if(a==="night"){S.settings.nightEnd=+t.value;save()}
  else if(a==="weeks"){S.settings.weeks=+t.value;ui.wk=0;save()}
  else if(a==="remdow"){S.settings.remDow=+t.value;save()}
  else if(a==="pfrole"){ui.panel.f.role=t.value}
  else if(a==="store"){S.settings.store=t.value.trim().toUpperCase()||"S192";save()}
  else return;
  render();
});
document.addEventListener("input",e=>{const t=e.target,a=t.dataset&&t.dataset.act;if(a==="q"){ui.q=t.value;render()}else if(a==="pf"&&ui.panel){ui.panel.f[t.dataset.k]=t.value}});
async function handleFile(inp,fn,okMsg){
  const f=inp.files[0];inp.value="";if(!f)return;
  if(RO)return toast("عرضك للقراءة فقط، ما تقدر تعدّل.");
  try{toast("جارٍ القراءة…");const n=await fn(f);toast(okMsg(n));ui.ed=null;ui.wk=0;initDay();render()}catch(err){toast("تعذّر الاستيراد: "+err.message)}
}
async function importLogo(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("الصورة غير مقروءة"));img.src=url});
  for(const max of [640,420,280]){
    const k=Math.min(1,max/img.width,(max/3)/img.height),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL("image/png");if(d.length<190000){S.logo=d;save();URL.revokeObjectURL(url);return}
  }
  URL.revokeObjectURL(url);throw new Error("الصورة كبيرة، جرّب صورة أبسط");
}
$("#fLogo").addEventListener("change",e=>handleFile(e.target,importLogo,()=>"تم رفع الشعار ✓"));
$("#fRoster").addEventListener("change",e=>handleFile(e.target,importRoster,n=>`تم استيراد جدول ${n} موظف ✓`));

function initDay(){
  const n=new Date(),iso=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`,i=dates().indexOf(iso);
  ui.di=i>=0?i:0;
}
/* ===================== cloud sync (db capability) ===================== */
const MUT=new Set(["upLogo","rmLogo","addemp","editemp","delemp","delok","restore","psave","apply","clear","undo","addsa","ignore","upRoster","weeks","lr","th","night","store","peak","resetth","remdow"]);
let DB=null,RO=false,SYNC=false,syncState="local",_hasRoster=false;
const _rem={ov:new Set(),hi:new Set()},_sent={},_ch={};
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
let _rt=0;const scheduleRender=()=>{if(!_rt)_rt=requestAnimationFrame(()=>{_rt=0;render()})};
function wr(path,fn){_ch[path]=(_ch[path]||Promise.resolve()).then(fn).catch(e=>{delete _sent[path];onWriteErr(e)})}
function onWriteErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"||c==="revoked"){RO=true;syncState="ro";toast("ما تقدر تحفظ التعديلات لأن صلاحيتك للقراءة فقط.")}
  else toast("تعذّر الحفظ في السحابة، حاول مرة ثانية.");
  scheduleRender();
}
function want(path,doc){const j=stable(doc);if(_sent[path]===j)return;_sent[path]=j;wr(path,()=>DB.doc(path).set(doc))}
function pushDiff(){
  if(!DB||!SYNC||RO)return;
  for(const [id,rec] of Object.entries(S.staff))want("staff/"+id,{rec,removed:false});
  for(const [id,r] of Object.entries(S.removed))want("staff/"+id,{rec:r.rec,removed:true,reason:r.reason||"",at:r.at||0});
  const live={ov:new Set(),hi:new Set()};
  for(const [k,o] of Object.entries(S.overrides)){const [id,date]=k.split("|");const path="overrides/"+id+"_"+date;live.ov.add(path);want(path,{id,date,kind:o.kind,reason:o.reason||"",s:o.s||0,e:o.e||0})}
  for(const [k,h] of Object.entries(S.history)){const [id,date]=k.split("|");const path="history/"+id+"_"+date;live.hi.add(path);want(path,{id,date,reason:h.reason||"",at:h.at||0})}
  for(const [set,coll] of [["ov","overrides"],["hi","history"]])for(const path of _rem[set])if(!live[set].has(path)&&_sent[path]!=="__del__"){_sent[path]="__del__";wr(path,()=>DB.doc(path).delete())}
  if(S.roster.dates.length)want("meta/roster",{dates:S.roster.dates,rows:S.roster.rows,at:S.rosterAt||0});
  want("meta/settings",S.settings);
  want("meta/known",{ids:S.known});
  want("meta/logo",{data:S.logo||""});
}
const mergeSettings=v=>{const o=JSON.parse(JSON.stringify(DEFAULTS));Object.assign(o,v);for(const g of Object.keys(DEFAULTS.th))o.th[g]=Object.assign({},DEFAULTS.th[g],(v.th&&v.th[g])||{});return o};
function applySnap(kind,snap){
  if(kind==="staff"){const st={},rm={};snap.docs.forEach(d=>{const v=d.data();if(!v||!v.rec)return;_sent["staff/"+d.id]=stable(v);if(v.removed)rm[d.id]={rec:v.rec,reason:v.reason||"",at:v.at||0};else st[d.id]=v.rec});S.staff=st;S.removed=rm}
  else if(kind==="ov"||kind==="hi"){const o={},old=new Set(_rem[kind]);_rem[kind].clear();snap.docs.forEach(d=>{const v=d.data();if(!v)return;const path=(kind==="ov"?"overrides/":"history/")+d.id;_rem[kind].add(path);_sent[path]=stable(v);o[v.id+"|"+v.date]=kind==="ov"?(v.kind==="off"?{kind:"off",reason:v.reason}:{kind:"shift",s:v.s,e:v.e}):{reason:v.reason,at:v.at}});for(const x of old)if(!_rem[kind].has(x))delete _sent[x];if(kind==="ov")S.overrides=o;else S.history=o}
  else{const v=snap.exists?snap.data():null;if(!v)return;if(kind==="roster")_hasRoster=true;_sent["meta/"+kind]=stable(v);
    if(kind==="roster"){S.roster={dates:v.dates,rows:v.rows};S.rosterAt=v.at||null}
    else if(kind==="settings")S.settings=mergeSettings(v);
    else if(kind==="known")S.known=v.ids||[];
    else if(kind==="logo")S.logo=v.data||""}
  cacheLocal();if(SYNC)scheduleRender();
}
function migrate(){
  let done=false;try{done=!!localStorage.getItem(KEY+".mig")}catch(e){}
  if(done||RO)return;
  const L=LOCAL0,empty=!Object.keys(S.staff).length&&!Object.keys(S.removed).length&&!_hasRoster;
  if(empty){S.staff=L.staff;S.removed=L.removed;S.roster=L.roster;S.rosterAt=L.rosterAt;S.known=L.known;S.settings=L.settings}
  for(const [id,r] of Object.entries(L.removed)){if(!S.removed[id]){S.removed[id]=r;delete S.staff[id]}}
  for(const [id,r] of Object.entries(L.extra))if(!S.removed[id])S.staff[id]=r;
  for(const [k,o] of Object.entries(L.overrides))if(!(k in S.overrides))S.overrides[k]=o;
  for(const [k,h] of Object.entries(L.history))if(!(k in S.history))S.history[k]=h;
  if(L.rosterUser&&L.roster.dates.length&&(!S.roster.dates.length||(L.rosterAt||0)>(S.rosterAt||0))){S.roster=L.roster;S.rosterAt=L.rosterAt}
  try{localStorage.setItem(KEY+".mig","1")}catch(e){}
  cacheLocal();pushDiff();
}
async function initSync(){
  if(!(window.claude&&window.claude.use)){syncState="local";render();return}
  syncState="connecting";render();
  try{DB=await window.claude.use("db")}catch(e){DB=null}
  if(!DB){syncState="local";render();return}
  try{const u=await window.claude.use("user");RO=!!(u&&u.can&&(await u.can("data.write"))===false)}catch(e){}
  const got=new Set();let started=false;
  const ready=()=>{if(started)return;started=true;SYNC=true;syncState=RO?"ro":"cloud";migrate();render()};
  const REQ=["staff","ov","hi","roster","settings","known"];
  const sub=(kind,ref)=>ref.onSnapshot(snap=>{applySnap(kind,snap);got.add(kind);if(REQ.every(k=>got.has(k)))ready()},e=>{if(!started){started=true;syncState="local";render()}});
  sub("staff",DB.collection("staff"));sub("ov",DB.collection("overrides"));sub("hi",DB.collection("history"));
  sub("roster",DB.doc("meta/roster"));sub("logo",DB.doc("meta/logo"));sub("settings",DB.doc("meta/settings"));sub("known",DB.doc("meta/known"));
  setTimeout(ready,8000);
}
function tickClock(){
  const d=new Date();let h=d.getHours();const ap=h<12?"ص":"م";h=h%12||12;
  $("#clkT").textContent=h+":"+pad(d.getMinutes());$("#clkS").textContent=pad(d.getSeconds());$("#clkA").textContent=ap;
  const g=d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if($("#clkD").textContent!==g)$("#clkD").textContent=g;
  try{const hj=d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"});if($("#clkH").textContent!==hj)$("#clkH").textContent=hj}catch(e){}
}
tickClock();setInterval(tickClock,1000);
initDay();render();initSync();
setInterval(()=>{if(ui.tab==="home"&&!ui.panel)render()},30000);
</script>
