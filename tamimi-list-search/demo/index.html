<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List Search · البحث بالقائمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app header, KPI strip, then a two-column workspace (list input | result rows). One light look. */
:root{
  --bg:#F5F4F4; --surface:#FFFFFF; --ink:#231F20; --ink-2:#4A4446; --muted:#77706F; --line:#E5E1E1;
  --brand:#C8161D; --brand-ink:#FFFFFF; --brand-soft:#FBE8E9;
  --good:#1F7A4D; --good-soft:#E5F2EB; --bad:#B4471A; --bad-soft:#FBECE4;
  --radius:14px; --shadow:0 1px 2px rgba(35,31,32,.06),0 4px 16px rgba(35,31,32,.06);
  --font-ar:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --font-en:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:15px;line-height:1.55}
html[lang="en"] body{font-family:var(--font-en)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}

/* header */
header.app{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.app .wrap{display:flex;align-items:center;gap:16px;min-height:68px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .wordmark{font-weight:700;color:var(--brand);font-size:18px}
.brand .sep{width:1px;height:28px;background:var(--line)}
.brand h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:99px}
.spacer{flex:1}
.basket{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-variant-numeric:tabular-nums}
.basket b{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--bg)}
.lang button{border:0;background:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-block:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .label{font-size:12.5px;color:var(--muted)}
.kpi .value{font-size:28px;font-weight:700;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:14px;color:var(--muted);font-weight:500}
.kpi.good .value{color:var(--good)} .kpi.bad .value{color:var(--bad)}

/* workspace */
.work{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;position:sticky;top:88px}
.panel h2{font-size:15px;margin:0}
.panel p.help{font-size:12.5px;color:var(--muted);margin:0}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FCFBFB;line-height:1.9}
textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.examples button:hover{border-color:var(--brand);color:var(--brand)}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px}
.primary:hover{filter:brightness(.95)}
.field-label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{border:0;background:none;border-radius:8px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-mode="old"][aria-pressed="true"]{color:var(--bad)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;user-select:none}
.switch input{width:36px;height:20px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{inset-inline-start:18px}
.mode-note{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}
.mode-note.old{background:var(--bad-soft);color:var(--bad)}

/* result rows */
.rows{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 12px;min-width:0}
.row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row-head h3{margin:0;font-size:18px}
.qty{font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.count{font-size:12.5px;color:var(--muted)}
.see-all{margin-inline-start:auto;border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.rail.all{flex-wrap:wrap;overflow:visible}
.card{flex:0 0 168px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;background:var(--surface);min-width:0}
.rail.all .card{flex:1 1 168px;max-width:200px}
.card.off{border-color:var(--bad);background:#FFFBF9}
.card.off::before{content:attr(data-off);position:absolute;top:8px;inset-inline-start:8px;font-size:10.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:6px;padding:1px 6px;z-index:1}
.tile{height:92px;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:center;padding:6px}
.brandname{font-size:11.5px;font-weight:700;color:var(--brand)}
.pname{font-size:13px;line-height:1.4;min-height:3.6em;overflow-wrap:anywhere}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.price{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.price small{font-weight:500;color:var(--muted);font-size:11px}
.add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;color:var(--brand);font-weight:700}
.add:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.oos{font-size:11px;color:var(--bad);font-weight:600}
.why{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;overflow-wrap:anywhere;direction:ltr;text-align:start}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:13.5px}
footer.note{font-size:12px;color:var(--muted);padding-bottom:28px}

@media (max-width:900px){
  .work{grid-template-columns:1fr}
  .panel{position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand h1{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="brand">
      <span class="wordmark">Tamimi Markets</span>
      <span class="sep" aria-hidden="true"></span>
      <h1 data-i18n="title"></h1>
      <span class="tag" data-i18n="prototype"></span>
    </div>
    <span class="spacer"></span>
    <span class="basket" id="basket" aria-live="polite"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="kpis" aria-label="Summary">
    <div class="kpi good"><div class="label" data-i18n="kpiNew"></div><div class="value" id="kNew"></div></div>
    <div class="kpi bad"><div class="label" data-i18n="kpiOld"></div><div class="value" id="kOld"></div></div>
    <div class="kpi"><div class="label" data-i18n="kpiItems"></div><div class="value" id="kItems"></div></div>
    <div class="kpi"><div class="label" data-i18n="kpiFound"></div><div class="value" id="kFound"></div></div>
  </section>

  <div class="work">
    <aside class="panel">
      <h2><label for="list" data-i18n="listLabel"></label></h2>
      <textarea id="list" spellcheck="false"></textarea>
      <p class="help" data-i18n="listHelp"></p>
      <div class="examples" id="examples"></div>
      <button class="primary" id="go" type="button" data-i18n="show"></button>
      <div class="field-label" data-i18n="modeLabel"></div>
      <div class="seg" role="group">
        <button type="button" data-mode="new" data-i18n="modeNew"></button>
        <button type="button" data-mode="old" data-i18n="modeOld"></button>
      </div>
      <p class="mode-note" id="modeNote"></p>
      <label class="switch"><input type="checkbox" id="why"><span data-i18n="why"></span></label>
    </aside>
    <section class="rows" id="rows" aria-live="polite"></section>
  </div>
  <footer class="note" data-i18n="footer"></footer>
</main>

<script>
const ListSearch = (() => {
// Arabic + English text normalisation shared by the index and the queries.
// Rule: anything done to product names must be done to queries the same way.

const ARABIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const PERSIAN_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

function normalize(text) {
  return String(text ?? '')
    .toLowerCase()
    .replace(/[٠-٩]/g, (d) => String(ARABIC_DIGITS.indexOf(d)))
    .replace(/[۰-۹]/g, (d) => String(PERSIAN_DIGITS.indexOf(d)))
    .replace(/[ً-ٰٟـ]/g, '') // diacritics and tatweel
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Light stemming. It removes only what never changes the meaning of a grocery word:
// the article "ال" and the plural endings "ات/ون/ين". It never cuts letters off the
// end of a word otherwise, so "لبنه" (labneh) stays different from "لبن" (laban).
function stem(word) {
  let w = word;
  if (w.length > 5 && /^(بال|وال|كال|فال)/.test(w)) w = w.slice(3); // "بالحليب" -> "حليب"
  else if (w.length > 4 && w.startsWith('لل')) w = w.slice(2);
  else if (w.length > 4 && w.startsWith('ال')) w = w.slice(2);
  if (w.length > 5 && /(ات|ون|ين)$/.test(w)) w = w.slice(0, -2);
  return w;
}

function tokenize(text) {
  return normalize(text).split(' ').filter(Boolean).map(stem);
}

const isLatin = (w) => /[a-z]/.test(w);

// Edit distance with an early exit once it passes `max`.
function withinDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return false;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      rowMin = Math.min(rowMin, cur[j]);
    }
    if (rowMin > max) return false;
    prev = cur;
  }
  return prev[b.length] <= max;
}



// Turns what the customer typed or pasted into clean list lines.
// Accepts new lines, Arabic or Latin commas, bullets and numbering ("1-", "2.").
// A bare number before or after the item is read as a quantity: "2 حليب", "حليب 2", "حليب x2".
function parseList(input, { maxLines = 40 } = {}) {
  const lines = String(input ?? '')
    .split(/\n|،|,|؛|;/)
    .map((l) => l.replace(/^\s*(?:[-•*·▪]|\d+\s*[.)\-])\s*/u, '').trim())
    .filter(Boolean);

  const seen = new Set();
  const out = [];
  for (const raw of lines) {
    const { text, quantity } = readQuantity(normalize(raw));
    if (!text || seen.has(text)) continue;
    seen.add(text);
    out.push({ input: raw, query: text, quantity });
    if (out.length >= maxLines) break;
  }
  return out;
}

function readQuantity(text) {
  let m = text.match(/^(\d{1,2})\s+(.+)$/);
  if (m) return { quantity: clamp(+m[1]), text: m[2] };
  m = text.match(/^(.+?)\s+x?(\d{1,2})$/);
  if (m) return { quantity: clamp(+m[2]), text: m[1] };
  return { quantity: 1, text };
}

const clamp = (n) => Math.max(1, Math.min(n, 99));



// Builds an in-memory index over the fields that describe the product itself.
// Descriptions and marketing tags are left out on purpose: they are where
// unrelated words come from (a jerky ad that mentions "laban", a berry box tagged "breakfast").
function buildIndex(products) {
  const docs = products.map((p, i) => {
    const nameTokens = tokenize(`${p.nameAr ?? ''} ${p.nameEn ?? ''}`);
    const brandTokens = tokenize(`${p.brandAr ?? ''} ${p.brandEn ?? ''}`);
    return {
      i,
      product: p,
      tokens: new Set([...nameTokens, ...brandTokens]),
      firstWord: tokenize(p.nameAr ?? '')[0] ?? tokenize(p.nameEn ?? '')[0],
    };
  });

  const postings = new Map(); // token -> Set(doc index)
  for (const d of docs) {
    for (const t of d.tokens) {
      if (!postings.has(t)) postings.set(t, new Set());
      postings.get(t).add(d.i);
    }
  }
  const vocabulary = [...postings.keys()];
  const vocabByScript = {
    latin: vocabulary.filter(isLatin),
    arabic: vocabulary.filter((w) => !isLatin(w)),
  };
  return { docs, postings, vocabByScript };
}





const WEIGHTS = { exact: 1, synonym: 0.9, typo: 0.7 };

function createSearcher(index, config = {}) {
  const synonyms = buildSynonyms(config.synonyms ?? []);
  const intents = buildIntents(config.intents ?? {});

  // All the ways one query word can match: itself, its synonyms, then close spellings.
  function expand(word) {
    const out = new Map([[word, { weight: WEIGHTS.exact, why: 'exact' }]]);
    for (const s of synonyms.get(word) ?? []) if (!out.has(s)) out.set(s, { weight: WEIGHTS.synonym, why: `synonym:${s}` });
    // Spelling fallback only when the word itself is unknown ("بيظ"), never for a known word:
    // otherwise "لبن" would drift to "لبنه" (labneh), one letter away.
    const known = [...out.keys()].some((t) => index.postings.has(t));
    if (!known && word.length >= 3) {
      const pool = isLatin(word) ? index.vocabByScript.latin : index.vocabByScript.arabic;
      const max = word.length >= 7 ? 2 : 1;
      for (const v of pool) {
        if (out.has(v)) continue;
        if (word.length === 3 && v[0] !== word[0]) continue; // short words: first letter must agree
        if (v.length >= 3 && withinDistance(word, v, max)) out.set(v, { weight: WEIGHTS.typo, why: `typo:${v}` });
      }
    }
    return out;
  }

  // One list line -> ranked products.
  // Whole-word matching only: "لبن" no longer matches "لبنه" (labneh) or "لبناني" (Lebanese).
  function searchLine(query, { limit = 20, includeOutOfStock = true } = {}) {
    const words = tokenize(query);
    if (!words.length) return { total: 0, items: [] };

    const perWord = words.map((w) => {
      const hits = new Map(); // doc index -> best {weight, why}
      for (const [term, m] of expand(w)) {
        for (const i of index.postings.get(term) ?? []) {
          const prev = hits.get(i);
          if (!prev || prev.weight < m.weight) hits.set(i, m);
        }
      }
      return hits;
    });

    // Every word of the line must match (AND).
    let candidates = [...perWord[0].keys()];
    for (const hits of perWord.slice(1)) candidates = candidates.filter((i) => hits.has(i));

    const intent = intents.get(normalize(query)) ?? intents.get(words.join(' '));
    const scored = [];
    for (const i of candidates) {
      const doc = index.docs[i];
      const p = doc.product;
      if (!includeOutOfStock && p.inStock === false) continue;

      const matches = perWord.map((h) => h.get(i));
      let score = matches.reduce((s, m) => s + m.weight, 0) / words.length; // 0..1 text relevance
      const reasons = matches.map((m) => m.why);

      if (doc.firstWord && expand(words[0]).has(doc.firstWord)) { score += 0.15; reasons.push('starts-with'); }
      if (intent) {
        if (intent.has(p.category)) { score += 0.5; reasons.push(`category:${p.category}`); }
        else { score -= 0.25; reasons.push('other-category'); }
      }
      if (p.inStock === false) { score -= 1; reasons.push('out-of-stock'); }
      score += (p.popularity ?? 0) * 0.05; // popularity only breaks ties

      scored.push({ product: p, score: +score.toFixed(3), reasons });
    }
    scored.sort((a, b) => b.score - a.score);
    return { total: scored.length, items: scored.slice(0, limit) };
  }

  // The feature itself: the whole list -> one result row per line.
  function searchList(input, options = {}) {
    return parseList(input, options).map((line) => ({ ...line, ...searchLine(line.query, options) }));
  }

  return { searchLine, searchList, expand };
}

function buildSynonyms(groups) {
  const map = new Map();
  for (const group of groups) {
    const words = group.map((w) => tokenize(w).join(' ')).filter(Boolean);
    for (const w of words) map.set(w, new Set([...(map.get(w) ?? []), ...words.filter((x) => x !== w)]));
  }
  return map;
}

function buildIntents(intents) {
  const map = new Map();
  for (const [term, categories] of Object.entries(intents)) {
    map.set(normalize(term), new Set(categories));
    map.set(tokenize(term).join(' '), new Set(categories));
  }
  return map;
}

return { normalize, tokenize, parseList, buildIndex, createSearcher,
  createListSearch: (products, config) => createSearcher(buildIndex(products), config) };
})();

const I18N = {

    listLabel: 'قائمة المقاضي', listHelp: 'سطر لكل غرض، أو افصل بفاصلة. الكمية قبل الغرض مثل «2 خبز». الأخطاء الإملائية البسيطة مقبولة.',

    basket: (n, t) => `السلة: <b>${n}</b> منتج · <b>${t}</b> ر.س`, sar: 'ر.س',

    examples: ['لبن، حليب، 2 خبز، رز، بيض، شاي', 'بيظ، شاهي، أرز', 'laban, milk, rice, tea'],
    defaultList: 'لبن\nحليب\n2 خبز\nرز\nبيض\nشاي',
  },
  en: {
    title: 'Shopping-list search', prototype: 'Prototype',
    kpiNew: 'Top-5 precision · proposed', kpiOld: 'Top-5 precision · current search', kpiItems: 'Items in the list', kpiFound: 'Items with results',
    listLabel: 'Grocery list', listHelp: 'One item per line, or separate with commas. Quantity first, e.g. “2 bread”. Small typos are fine. Customers mostly type in Arabic.',
    show: 'Show results', modeLabel: 'Search engine', modeNew: 'Proposed', modeOld: 'Current (simulated)', why: 'Why shown? (reason for each product)',
    noteNew: 'Whole words, Arabic and English synonyms, intended category first, popularity only to break ties.',

};
const CATS = {
  laban: ['لبن', 'Laban', '#E3F0F7'], labneh: ['لبنة', 'Labneh', '#EEF3E6'], milk: ['حليب', 'Milk', '#E8EEF8'], 'flavoured-milk': ['حليب منكّه', 'Flavoured milk', '#F1E9F5'],
  berries: ['توت', 'Berries', '#F8E3E7'], pickles: ['مخللات', 'Pickles', '#EEF0E2'], yogurt: ['زبادي', 'Yoghurt', '#EAF2F1'], cheese: ['أجبان', 'Cheese', '#FBF1DC'],
  sauces: ['صلصات', 'Sauces', '#FBE8E1'], snacks: ['سناكات', 'Snacks', '#F7ECE0'], rice: ['أرز', 'Rice', '#F6F2E7'], flour: ['دقيق', 'Flour', '#F3F1EC'],
  pasta: ['مكرونة', 'Pasta', '#FAF0D9'], eggs: ['بيض', 'Eggs', '#FBF3E2'], chicken: ['دجاج', 'Chicken', '#FBEDE6'], cream: ['كريمة', 'Cream', '#F4F1F6'],
  sugar: ['سكر', 'Sugar', '#F2F2F4'], tea: ['شاي', 'Tea', '#F7EDE3'], 'soft-drinks': ['مشروبات', 'Soft drinks', '#FDEFE6'], water: ['مياه', 'Water', '#E5F1FA'],
  potato: ['بطاطس', 'Potato', '#F7F0E1'], canned: ['معلبات', 'Canned', '#F6E7E4'], bread: ['خبز', 'Bread', '#F8EEDF'],
};

let lang = 'ar', mode = 'new', basket = {};
const t = (k) => I18N[lang][k];

// Rough simulation of today's behaviour, for the comparison only.
const OLD_TRANSLATE = { 'لبن': 'milk' };
function oldSearchLine(q) {
  const n = ListSearch.normalize(q), en = OLD_TRANSLATE[n];
  const items = DATA.products.filter((p) => {
    const ar = ListSearch.normalize(`${p.nameAr} ${p.brandAr}`), e = ListSearch.normalize(`${p.nameEn} ${p.brandEn}`);
    return ar.includes(n) || e.includes(n) || (en && e.includes(en));
  }).sort((a, b) => (b.popularity ?? 0) - (a.popularity ?? 0)).map((p) => ({ product: p, reasons: ['substring', 'popularity'] }));
  return { total: items.length, items };
}
const intentOf = (q) => DATA.config.intents[ListSearch.normalize(q)] ?? DATA.config.intents[q];
const top5Relevant = (r, intent) => r.items.slice(0, 5).filter((x) => intent.includes(x.product.category)).length;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const money = (n) => n.toLocaleString(lang === 'ar' ? 'ar-SA' : 'en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function card(x, intent, qty) {
  const p = x.product, cat = CATS[p.category] ?? [p.category, p.category, '#EEE'];
  const c = el('div', 'card');
  if (intent && !intent.includes(p.category)) { c.classList.add('off'); c.dataset.off = t('off'); }
  const tile = el('div', 'tile', lang === 'ar' ? cat[0] : cat[1]); tile.style.background = cat[2];
  const br = el('div', 'brandname', (lang === 'ar' ? p.brandAr : p.brandEn) || ' ');
  const nm = el('div', 'pname', lang === 'ar' ? p.nameAr : p.nameEn);
  const pr = el('div', 'price-row');
  const price = el('div', 'price'); price.innerHTML = `${money(p.price)} <small>${t('sar')}</small>`;
  pr.append(price);
  if (p.inStock === false) pr.append(el('span', 'oos', t('oos')));
  else { const b = el('button', 'add', '+'); b.type = 'button'; b.setAttribute('aria-label', `${t('add')} ${nm.textContent}`); b.onclick = () => { basket[p.id] = (basket[p.id] ?? 0) + qty; renderBasket(); }; pr.append(b); }
  c.append(tile, br, nm, pr);
  if ($('why').checked) c.append(el('div', 'why', x.reasons.join(' · ')));
  return c;
}

function renderBasket() {
  const n = Object.values(basket).reduce((a, b) => a + b, 0);
  const total = Object.entries(basket).reduce((s, [id, q]) => s + DATA.products.find((p) => p.id === id).price * q, 0);
  $('basket').innerHTML = t('basket')(n, money(total));
}

function run() {
  const lines = ListSearch.parseList($('list').value);
  const box = $('rows'); box.replaceChildren();
  let gNew = 0, gOld = 0, sNew = 0, sOld = 0, found = 0;
  for (const line of lines) {
    const rNew = search.searchLine(line.query, { limit: 20 }), rOld = oldSearchLine(line.query);
    const r = mode === 'new' ? rNew : rOld, intent = intentOf(line.query);
    if (rNew.total) found++;
    if (intent) { gNew += top5Relevant(rNew, intent); sNew += Math.min(5, rNew.items.length); gOld += top5Relevant(rOld, intent); sOld += Math.min(5, rOld.items.length); }

    const row = el('article', 'row'), head = el('div', 'row-head');
    head.append(el('h3', null, line.input));
    if (line.quantity > 1) head.append(el('span', 'qty', `× ${line.quantity}`));
    if (intent && r.items.length) { const k = top5Relevant(r, intent), n = Math.min(5, r.items.length); head.append(el('span', `pill ${k === n ? 'ok' : 'no'}`, t('relevant')(k, n))); }
    head.append(el('span', 'count', t('results')(r.total)));
    row.append(head);
    if (r.items.length) {
      const rail = el('div', 'rail');
      r.items.forEach((x) => rail.append(card(x, intent, line.quantity)));
      if (r.items.length > 4) {
        const b = el('button', 'see-all', t('seeAll')(r.items.length)); b.type = 'button';
        b.onclick = () => { const all = rail.classList.toggle('all'); b.textContent = all ? t('hide') : t('seeAll')(r.items.length); };
        head.append(b);
      }
      row.append(rail);
    } else row.append(el('div', 'empty', t('empty')(line.input)));
    box.append(row);
  }
  const pct = (a, b) => (b ? `${Math.round((100 * a) / b)}%<small> · ${a}/${b}</small>` : '–');
  $('kNew').innerHTML = pct(gNew, sNew);
  $('kOld').innerHTML = pct(gOld, sOld);
  $('kItems').textContent = lines.length;
  $('kFound').innerHTML = `${found}<small> / ${lines.length}</small>`;
}

function setLang(l) {
  const keepList = $('list').value && $('list').value !== I18N[lang].defaultList;
  lang = l;
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === l));
  if (!keepList) $('list').value = t('defaultList');
  const ex = $('examples'); ex.replaceChildren();
  t('examples').forEach((s) => { const b = el('button', null, s); b.type = 'button'; b.onclick = () => { $('list').value = s.split(/،|,/).map((x) => x.trim()).join('\n'); run(); }; ex.append(b); });
  setMode(mode); renderBasket();
  try { localStorage.setItem('ls-lang', l); } catch (e) {}
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
  const n = $('modeNote'); n.textContent = m === 'new' ? t('noteNew') : t('noteOld'); n.classList.toggle('old', m === 'old');
  run();
}

document.querySelectorAll('.lang button').forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));
document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
$('go').onclick = run;
$('why').onchange = run;
let saved = 'ar'; try { saved = localStorage.getItem('ls-lang') || 'ar'; } catch (e) {}
setLang(saved === 'en' ? 'en' : 'ar');
</script>
